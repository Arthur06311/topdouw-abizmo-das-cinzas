// ==================== CAMERA ====================
const camera = { x: 0, y: 0 };
function updateCamera(target, mapW, mapH) {
  camera.x = target.x * SCALE * TILE - CW / 2 + TILE * SCALE / 2;
  camera.y = target.y * SCALE * TILE - CH / 2 + TILE * SCALE / 2;
  camera.x = Math.max(0, Math.min(camera.x, mapW * TILE * SCALE - CW));
  camera.y = Math.max(0, Math.min(camera.y, mapH * TILE * SCALE - CH));
  // Apply screen shake
  camera.x += shake.x; camera.y += shake.y;
}

// ==================== SCREEN SHAKE ====================
const shake = { x:0, y:0, intensity:0, timer:0 };
function addShake(intensity, duration) {
  shake.intensity = Math.max(shake.intensity, intensity);
  shake.timer = Math.max(shake.timer, duration);
}
function updateShake(dt) {
  if (shake.timer > 0) {
    shake.timer -= dt;
    shake.x = (Math.random()-0.5) * shake.intensity * 2;
    shake.y = (Math.random()-0.5) * shake.intensity * 2;
    shake.intensity *= 0.92;
  } else { shake.x = 0; shake.y = 0; shake.intensity = 0; }
}

// ==================== PARTICLES ====================
const MAX_PARTICLES = 200;
let particles = [];
function addParticle(x, y, color, life, vx, vy, size) {
  if (particles.length >= MAX_PARTICLES) particles.splice(0, 20);
  particles.push({ x, y, color, life, maxLife: life, vx: vx||((Math.random()-0.5)*2), vy: vy||(-(Math.random()*2+1)), size: size||2 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x * SCALE - camera.x, p.y * SCALE - camera.y, p.size * SCALE, p.size * SCALE);
  }
  ctx.globalAlpha = 1;
}

// ==================== FLOATING TEXT ====================
let floatingTexts = [];
function addFloatText(x, y, text, color) {
  // Limitar a 15 textos max na tela
  if (floatingTexts.length > 15) floatingTexts.shift();
  floatingTexts.push({ x: x*TILE, y: y*TILE, text, color, life: 1.2, maxLife: 1.2 });
}
function updateFloatTexts(dt) {
  for (let i = floatingTexts.length-1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 30*dt; // sobe mais rapido
    ft.life -= dt;
    // Forcar remocao apos tempo
    if (ft.life <= 0 || (ft.maxLife - ft.life) > 2) {
      floatingTexts.splice(i, 1);
    }
  }
}
function drawFloatTexts() {
  ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
  for (const ft of floatingTexts) {
    const alpha = Math.max(0, Math.min(1, ft.life / (ft.maxLife * 0.5)));
    if (alpha <= 0) continue;
    ctx.globalAlpha = alpha;
    const sx = ft.x*SCALE - camera.x;
    const sy = ft.y*SCALE - camera.y;
    // Outline
    ctx.fillStyle = '#000';
    ctx.fillText(ft.text, sx+1, sy+1);
    ctx.fillText(ft.text, sx-1, sy-1);
    // Texto
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, sx, sy);
  }
  ctx.globalAlpha = 1;
}

function getObjectiveArrowTarget() {
  if (!player.tutorialDone || !showObjectiveArrow) return null;
  const map = maps[player.currentMap];
  if (!map) return null;

  // 1. Blue arrow to upgrader if player has unclaimed matter
  if (player.matterCount > player.weaponLevel && player.weapon) {
    for (const n of npcs) {
      if (n.type === 'upgrader') return { x: n.x, y: n.y, color: '#4488ff' };
    }
  }

  // 2. Orange arrow to bonfire if player hasn't rested in this map
  if (player.lastBonfire.map !== player.currentMap) {
    for (const bf of bonfires) {
      if (Math.hypot(player.x - bf.x, player.y - bf.y) > 3) {
        return { x: bf.x, y: bf.y, color: '#ff8844' };
      }
    }
  }

  // 3. Green arrow to forward exit if boss is killed in this area
  if (player.killedBosses.has(player.currentMap)) {
    const curIdx = AREA_ORDER.indexOf(player.currentMap);
    const nextMap = curIdx >= 0 && curIdx < AREA_ORDER.length - 1 ? AREA_ORDER[curIdx + 1] : null;
    if (nextMap) {
      for (const ex of activeExits) {
        if (ex.target === nextMap) return { x: ex.x, y: ex.y, color: '#44ff44' };
      }
    }
  }

  // 4. Red arrow to boss door if boss alive and <=3 enemies remain
  if (!player.killedBosses.has(player.currentMap) && enemies.length <= 3 && map._bossDoorX >= 0) {
    return { x: map._bossDoorX, y: map._bossDoorY, color: '#ff4444' };
  }

  return null;
}

// ==================== MAP GENERATION HELPER ====================
function mapGen(w, h) {
  const t = new Array(w * h).fill(0);
  const me = {
    t,
    set(x, y, v) { if (x >= 0 && x < w && y >= 0 && y < h) t[y * w + x] = v; },
    get(x, y) { return (x >= 0 && x < w && y >= 0 && y < h) ? t[y * w + x] : 0; },
    fill(x1, y1, x2, y2, v) {
      for (let y = Math.max(0,y1); y <= Math.min(h-1,y2); y++)
        for (let x = Math.max(0,x1); x <= Math.min(w-1,x2); x++) me.set(x, y, v);
    },
    room(x1, y1, x2, y2, floor, wall) {
      me.fill(x1, y1, x2, y2, floor || 2);
      for (let x = x1; x <= x2; x++) { me.set(x, y1, wall || 4); me.set(x, y2, wall || 3); }
      for (let y = y1; y <= y2; y++) { me.set(x1, y, wall || 3); me.set(x2, y, wall || 3); }
    },
    corridor(x1, y1, x2, y2, floor) {
      me.fill(Math.min(x1,x2), Math.min(y1,y2), Math.max(x1,x2), Math.max(y1,y2), floor || 2);
    },
    pillars(x1, y1, x2, y2, spacingX, spacingY) {
      for (let y = y1; y <= y2; y += spacingY || 4)
        for (let x = x1; x <= x2; x += spacingX || 4)
          if (me.get(x,y) === 2 || me.get(x,y) === 1) me.set(x, y, 20);
    },
    scatter(x1, y1, x2, y2, tile, chance) {
      for (let y = y1; y <= y2; y++)
        for (let x = x1; x <= x2; x++) {
          const cur = me.get(x, y);
          if ((cur === 2 || cur === 1 || cur === 12 || cur === 13) && Math.random() < chance) me.set(x, y, tile);
        }
    },
    border(wall) {
      for (let x = 0; x < w; x++) { me.set(x, 0, wall || 4); me.set(x, h-1, wall || 3); }
      for (let y = 0; y < h; y++) { me.set(0, y, wall || 3); me.set(w-1, y, wall || 3); }
    },
  };
  return me;

function getPlayerDamage() {
  const base = 5 + player.stats.strength * 2 + player.weaponLevel * 5;
  // Critical hit: dexterity increases crit chance (5% + 2% per dex)
  const critChance = 0.05 + player.stats.dexterity * 0.02;
  if (Math.random() < critChance) {
    player._lastCrit = true;
    return Math.floor(base * 1.8);
  }
  player._lastCrit = false;
  return base;
}
function getPlayerDefense() {
  return player.stats.resistance * 1.5;
}
function getAttackSpeed() {
  return Math.max(0.15, 0.4 - player.stats.dexterity * 0.02);
}

// ==================== ENTITIES ====================
let enemies = [];
let items = [];
let bosses = [];
let npcs = [];
let bonfires = [];
let chests = [];
let activeExits = [];

const ENEMY_TYPES = {
  skeleton: { hp:20, dmg:5, speed:1.2, color:'#bbaa88', xp:10, drop:'ore_iron' },
  skull:    { hp:30, dmg:8, speed:1.5, color:'#aabb99', xp:15, drop:'ore_gold' },
  vampire:  { hp:45, dmg:12, speed:1.8, color:'#8855aa', xp:25, drop:'ore_crystal' },
};

// Area difficulty scaling
const AREA_SCALE = { tutorial:1, ashWastes:1, boneCaverns:1.3, cursedGrounds:1.6, fireDepths:2.0, shadowRuins:2.5, dragonLair:3.0 };

function spawnEnemy(type, x, y) {
  const def = ENEMY_TYPES[type];
  const scale = AREA_SCALE[player.currentMap] || 1;
  const diffScale = DIFFICULTY_SCALE[gameDifficulty] || DIFFICULTY_SCALE.normal;
  const hp = Math.floor(def.hp * scale * diffScale.hp);
  const dmg = Math.floor(def.dmg * scale * diffScale.dmg);
  const xp = Math.floor(def.xp * scale);
  enemies.push({
    type, x, y, hp, maxHp: hp, dmg, speed: def.speed * (1 + (scale-1)*0.15),
    color: def.color, xp, drop: def.drop,
    vx:0, vy:0, state:'idle', stateTimer:Math.random()*3,
    animFrame:0, animTimer:0, hitTimer:0, facing:0,
    aggro: false, aggroRange: 6,
  });
}

function spawnBoss(mapName) {
  const bd = BOSS_DATA[mapName];
  if (!bd || player.killedBosses.has(mapName)) return;
  const map = maps[mapName];
  // Find boss door position and spawn boss near it
  let cx = Math.floor(map.width/2), cy = Math.floor(map.height/2);
  for (let ty2 = 0; ty2 < map.height; ty2++) {
    for (let tx2 = 0; tx2 < map.width; tx2++) {
      if (map.tiles[ty2 * map.width + tx2] === 14) {
        cx = tx2; cy = ty2 - 4; // spawn a few tiles above boss door
      }
    }
  }
  const bDiffScale = DIFFICULTY_SCALE[gameDifficulty] || DIFFICULTY_SCALE.normal;
  const bossHp = Math.floor(bd.hp * bDiffScale.hp);
  const bossDmg = Math.floor(bd.dmg * bDiffScale.dmg);
  bosses.push({
    name: bd.name, x: cx, y: cy, hp: bossHp, maxHp: bossHp, dmg: bossDmg,
    speed: bd.speed, color: bd.color, size: bd.size, matterIndex: bd.matterIndex,
    isFinal: bd.isFinal||false, mapName, sprite: bd.sprite||'skeleton',
    vx:0, vy:0, state:'idle', stateTimer:2, attackTimer:0,
    phase:0, animFrame:0, animTimer:0, hitTimer:0, facing:0,
    chargeTimer:0, charging:false, specialTimer:5,
  });
}

// ==================== LOAD MAP ====================
function loadMap(mapName, px, py) {
  const map = maps[mapName];
  if (!map) return;
  player.currentMap = mapName;
  player.x = px !== undefined ? px : map.startX;
  player.y = py !== undefined ? py : map.startY;
  enemies = []; items = []; bosses = []; npcs = []; bonfires = []; chests = []; activeExits = [];
  particles = []; floatingTexts = [];

  // Spawn enemies (nao spawna no tutorial - sao adicionados pelo sistema de tutorial)
  if (mapName !== 'tutorial') {
    for (const e of map.enemies) spawnEnemy(e.type, e.x, e.y);
  }

  // Spawn bonfires
  for (const b of map.bonfires) bonfires.push({ x:b.x, y:b.y, lit:true });

  // Spawn chests
  for (const c of map.chests) {
    const key = mapName+'_'+c.x+'_'+c.y;
    chests.push({ x:c.x, y:c.y, item:c.item, opened: player.openedChests.has(key), key });
  }

  // Spawn NPCs
  for (const n of map.npcs) npcs.push({ x:n.x, y:n.y, type:n.type, name:n.name, animFrame:0, animTimer:0 });

  // Exits
  for (const e of map.exits) activeExits.push(e);

  // Boss (only spawns if area has boss door and boss not killed)
  if (BOSS_DATA[mapName] && !player.killedBosses.has(mapName)) {
    // Boss spawns when player approaches boss area
  }

  // Cache boss door position
  map._bossDoorX = -1; map._bossDoorY = -1;
  for (let ty2 = 0; ty2 < map.height; ty2++) {
    for (let tx2 = 0; tx2 < map.width; tx2++) {
      if (map.tiles[ty2 * map.width + tx2] === 14) {
        map._bossDoorX = tx2; map._bossDoorY = ty2;
      }
    }
  }

  // Story intro on first visit
  if (AREA_STORIES[mapName] && !visitedMaps.has(mapName)) {
    visitedMaps.add(mapName);
    storyIntroLines = AREA_STORIES[mapName];
    storyIntroTimer = 5.0;
    storyIntroActive = true;
  }
}

// ==================== COLLISION ====================
function getTile(map, x, y) {
  if (x < 0 || y < 0 || x >= map.width || y >= map.height) return 0;
  return map.tiles[y * map.width + x];
}

function canWalk(map, x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  const tile = getTile(map, tx, ty);
  return WALKABLE.has(tile);
}

function rectCollide(ax,ay,aw,ah,bx,by,bw,bh) {
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ==================== UPDATE PLAYER ====================
function updatePlayer(dt) {
  if (player.dead) return;
  const map = maps[player.currentMap];

  // ---- DODGE / ROLL ----
  if (player.dodgeCooldown > 0) player.dodgeCooldown -= dt;
  if (player.dodging) {
    player.dodgeTimer -= dt;
    const dspd = 10 * dt;
    const nx2 = player.x + player.dodgeDx * dspd;
    const ny2 = player.y + player.dodgeDy * dspd;
    if (canWalk(map, nx2+0.2, ny2+0.2) && canWalk(map, nx2+0.8, ny2+0.8)) {
      player.x = nx2; player.y = ny2;
    }
    player.invincible = 0.1; // invencivel durante esquiva
    for(let i=0;i<2;i++) addParticle(player.x*TILE+8, player.y*TILE+8, '#aaaaff', 0.2, (Math.random()-0.5)*2, (Math.random()-0.5)*2, 1);
    if (player.dodgeTimer <= 0) player.dodging = false;
    return; // nao faz nada durante dodge
  }

  // Movement
  let dx = 0, dy = 0;
  if (keys['w']||keys['arrowup']) dy=-1;
  if (keys['s']||keys['arrowdown']) dy=1;
  if (keys['a']||keys['arrowleft']) dx=-1;
  if (keys['d']||keys['arrowright']) dx=1;

  if (dx!==0&&dy!==0) { dx*=0.707; dy*=0.707; }

  if (dx!==0||dy!==0) {
    if (dy<0) player.facing=1;
    else if (dy>0) player.facing=0;
    if (dx<0) player.facing=2;
    else if (dx>0) player.facing=3;
    player.walkFrame += dt * 8;
  }

  // Iniciar Dodge (Shift)
  if (keys['shift'] && player.dodgeCooldown <= 0 && player.stamina >= 10) {
    keys['shift'] = false;
    player.dodging = true;
    player.dodgeTimer = 0.2;
    player.dodgeCooldown = 0.6;
    player.stamina -= 10;
    // Direcao do dodge: usa input ou facing
    if (dx!==0||dy!==0) {
      player.dodgeDx = dx; player.dodgeDy = dy;
    } else {
      player.dodgeDx = player.facing===3?1:player.facing===2?-1:0;
      player.dodgeDy = player.facing===0?1:player.facing===1?-1:0;
    }
    return;
  }

  const spd = player.speed * dt;
  const nx = player.x + dx * spd;
  const ny = player.y + dy * spd;

  if (canWalk(map, nx+0.2, player.y+0.2) && canWalk(map, nx+0.8, player.y+0.2) &&
      canWalk(map, nx+0.2, player.y+0.8) && canWalk(map, nx+0.8, player.y+0.8)) player.x = nx;
  if (canWalk(map, player.x+0.2, ny+0.2) && canWalk(map, player.x+0.8, ny+0.2) &&
      canWalk(map, player.x+0.2, ny+0.8) && canWalk(map, player.x+0.8, ny+0.8)) player.y = ny;

  // Hazard damage (spike traps, lava)
  const playerTileX = Math.floor(player.x + 0.5), playerTileY = Math.floor(player.y + 0.5);
  const currentTile = getTile(map, playerTileX, playerTileY);
  if (DAMAGING[currentTile] && player.invincible <= 0) {
    const hazardDmg = DAMAGING[currentTile] * dt;
    player.hp -= hazardDmg;
    if (Math.random() < 0.3) addParticle(player.x*TILE+8, player.y*TILE+8, currentTile===22?'#ff4400':'#aaaaaa', 0.3);
    if (player.hp <= 0) {
      player.hp = 0; player.dead = true;
      gameState = STATE.GAME_OVER;
      return;
    }
  }

  // Attack
  player.attackCooldown -= dt;
  if (player.attackCooldown < 0) player.attackCooldown = 0;

  if ((mouse.clicked || keys[' ']) && player.weapon && player.attackCooldown <= 0 && player.stamina >= 5) {
    player.attacking = true;
    player.attackTimer = 0.2;
    player.attackCooldown = getAttackSpeed();
    player.stamina -= 5;

    // Determine attack direction
    const atkX = player.x + (player.facing===3?1.2:player.facing===2?-0.8:0.2);
    const atkY = player.y + (player.facing===0?1.2:player.facing===1?-0.8:0.2);

    // Check enemy hits
    for (const e of enemies) {
      const dist = Math.hypot(e.x-atkX, e.y-atkY);
      if (dist < 1.5) {
        const dmg = Math.max(1, getPlayerDamage());
        e.hp -= dmg;
        e.hitTimer = 0.2;
        e.vx = (e.x-player.x)*3; e.vy = (e.y-player.y)*3;
        addFloatText(e.x, e.y, player._lastCrit ? 'CRIT -'+dmg+'!' : '-'+dmg, player._lastCrit ? '#ffff00' : '#ff4444');
        addShake(player._lastCrit ? 6 : 3, player._lastCrit ? 0.15 : 0.1);
        const hitCol = player._lastCrit ? '#ffff00' : '#ff4444';
        for(let i=0;i<(player._lastCrit?8:5);i++) addParticle(e.x*TILE+8, e.y*TILE+8, hitCol, 0.5);
      }
    }
    // Check boss hits
    for (const b of bosses) {
      const dist = Math.hypot(b.x-atkX, b.y-atkY);
      if (dist < 2) {
        const dmg = Math.max(1, getPlayerDamage());
        b.hp -= dmg;
        b.hitTimer = 0.2;
        addFloatText(b.x, b.y, '-'+dmg, '#ffaa00');
        addShake(4, 0.12);
        for(let i=0;i<8;i++) addParticle(b.x*TILE+8, b.y*TILE+8, '#ffaa00', 0.5);
      }
    }

    // Slash particles
    const sx = player.x*TILE+8+(player.facing===3?16:player.facing===2?-16:0);
    const sy = player.y*TILE+8+(player.facing===0?16:player.facing===1?-16:0);
    for(let i=0;i<6;i++) addParticle(sx, sy, '#ffffff', 0.3, (Math.random()-0.5)*4, (Math.random()-0.5)*4, 1);
  }
  if (player.attackTimer > 0) player.attackTimer -= dt;
  else player.attacking = false;

  // Mining
  if (keys['e'] && player.hasPickaxe && !player.mining) {
    const fx = Math.floor(player.x + (player.facing===3?1:player.facing===2?-1:0));
    const fy = Math.floor(player.y + (player.facing===0?1:player.facing===1?-1:0));
    const tile = getTile(map, fx, fy);
    if (MINABLE.has(tile)) {
      player.mining = true;
      player.mineTimer = 1.0;
      player.mineTarget = { x:fx, y:fy, tile };
    }
  }
  if (player.mining) {
    player.mineTimer -= dt;
    const mt = player.mineTarget;
    addParticle(mt.x*TILE+8, mt.y*TILE+8, '#aaaaaa', 0.3, (Math.random()-0.5)*3, (Math.random()-0.5)*3, 1);
    if (player.mineTimer <= 0) {
      player.mining = false;
      map.tiles[mt.y * map.width + mt.x] = (getTile(map, mt.x, mt.y) === 12) ? 12 : (getTile(map,mt.x,mt.y)===13?13:2);
      // Drop ore
      const oreNames = { 5:'Iron Ore', 6:'Gold Ore', 7:'Crystal', 17:'Diamond' };
      const oreValues = { 5:5, 6:15, 7:30, 17:60 };
      const oreName = oreNames[mt.tile]||'Ore';
      const oreVal = oreValues[mt.tile]||5;
      items.push({ x:mt.x, y:mt.y, name:oreName, type:'ore', value:oreVal, animTimer:0 });
      addFloatText(mt.x, mt.y, oreName, '#ffcc00');
    }
  }

  // Interact (F key)
  if (keys['f']) {
    keys['f'] = false;
    // Bonfire
    for (const b of bonfires) {
      if (Math.hypot(b.x-player.x, b.y-player.y) < 1.5) {
        player.hp = player.maxHp; player.stamina = player.maxStamina;
        player.lastBonfire = { map:player.currentMap, x:b.x, y:b.y };
        if (activeSlot >= 0) saveGame(activeSlot);
        gameState = STATE.BONFIRE; bonfireMenu = 0;
        return;
      }
    }
    // Chest
    for (const c of chests) {
      if (!c.opened && Math.hypot(c.x-player.x, c.y-player.y) < 1.5) {
        if (c.item === 'weapon_choice') {
          c.opened = true;
          player.openedChests.add(c.key);
          gameState = STATE.WEAPON_CHOICE;
          return;
        }
        const _c = c;
        showMathChallenge(() => {
          _c.opened = true;
          player.openedChests.add(_c.key);
          if (_c.item === 'flask') {
            player.inventory.push({ name:'Life Flask', type:'flask', value:20 });
            showDialog('Found a Life Flask! Press Q to heal quickly.');
          } else if (_c.item === 'key') {
            player.inventory.push({ name:'Ancient Key', type:'key', value:50 });
            showDialog('Found an Ancient Key! You can sell it for many ashes.');
          } else if (_c.item === 'ashes50') {
            player.ashes += 50;
            showDialog('Found 50 hidden Ashes!');
            addFloatText(player.x, player.y, '+50 Ashes', '#ffaa44');
          } else if (_c.item === 'flask2') {
            player.inventory.push({ name:'Life Flask', type:'flask', value:20 });
            player.inventory.push({ name:'Life Flask', type:'flask', value:20 });
            showDialog('Found 2 Life Flasks!');
          }
        });
        return;
      }
    }
    // NPC
    for (const n of npcs) {
      if (Math.hypot(n.x-player.x, n.y-player.y) < 2) {
        if (n.type === 'merchant') {
          // Context-sensitive greeting tied to world lore
          const bossCount = player.killedBosses.size;
          if (bossCount === 0) showDialog('I am Elara. My husband turned to ash the day the God left. I sell what remains of our life... perhaps it will help you survive longer than he did.');
          else if (bossCount === 1) showDialog('You killed the Guardian? That stone golem protected our city gates for centuries. Now it can rest. I have better wares for you - things my husband forged before the end.');
          else if (bossCount < 4) showDialog('Word spreads even through ashes. ' + bossCount + ' guardians fallen. Each one was someone once, you know. But the fragments must be gathered. Browse my wares.');
          else if (bossCount < 6) showDialog('I can feel it... the ashes are lighter. The land remembers what it was. You carry so much divine power now. Take what you need - gold means nothing if the world heals.');
          else showDialog('Cindara awaits you. The dragon... she used to fly over our city. The children would wave. She would roar softly back. Please... be gentle with her.');
          gameState = STATE.SHOP; shopPage = 0; return;
        }
        if (n.type === 'upgrader') {
          if (player.matterCount > player.weaponLevel && player.weapon) {
            player.weaponLevel++;
            player.matterCount--;
            gameState = STATE.CUTSCENE; cutsceneTimer = 4;
            showDialog('The Neutral Matter sings as it fuses with your weapon... Level ' + player.weaponLevel + '! Each fragment carries a piece of the God\'s will. Can you feel it?');
          } else if (!player.weapon) {
            showDialog('You carry no weapon, yet you seek the divine forge? Return when you have something to channel the Matter through. Even the God needed a vessel.');
          } else if (player.matterCount === 0) {
            showDialog('The fragments are scattered across the land, each guarded by a soul who could not let go. Defeat them - free them - and bring the Matter to me.');
          } else {
            showDialog('Your weapon hums with all the Matter it can hold. The remaining fragments await deeper in the world. Each guardian you face was once a protector, like you.');
          }
          return;
        }
      }
    }
    // Lore tablet
    const faceDx = player.facing===3?1:player.facing===2?-1:0;
    const faceDy = player.facing===0?1:player.facing===1?-1:0;
    const loreTx = Math.floor(player.x + faceDx);
    const loreTy = Math.floor(player.y + faceDy);
    if (getTile(map, loreTx, loreTy) === 25) {
      // Multiple lore texts per area, cycled by position
      const lorePool = {
        tutorial: [
          'These ruins were a sanctuary before the divine abandonment...',
          'Someone wrote here: "When the god departs, the ashes shall come."',
          '"The God created nine fragments. Nine souls of creation. Lose even one, and balance fails."',
          'A child\'s drawing on the wall: a tall figure leaving, a dragon weeping behind him.',
        ],
        ashWastes: [
          'Ashes cover everything... Neutral Matter fragmented into nine pieces when the god departed.',
          '"The Ash Guardian was born from the rage of the abandoned land. It protects the fragment."',
          'Claw marks on the stones. The divine creature passed through here, devouring everything.',
          '"I am Elara, merchant. My husband became ash before my eyes. I sell what remains of our life."',
          '"The Guardian was once a stone golem, built to protect the city gates. Now it protects nothing."',
        ],
        boneCaverns: [
          'The bones of ancient warriors still guard these caverns. They failed to stop the creature.',
          '"The Bone Lord was a hero. The curse turned him into what guards these depths."',
          'Hundreds of adventurers lie here. Their bones move on their own in the darkness.',
          '"Commander Aldric led the last stand against the dragon. He fell here, still holding his shield."',
          '"His daughter waits at the surface. She has waited for thirty years. She will wait forever."',
        ],
        cursedGrounds: [
          'The curse corrupts the land. The divine creature absorbed the power of these lands.',
          '"Do not drink the water. Do not touch the plants. The land is poisoned to its soul."',
          'The Cursed Abomination was a priest who tried to purify the land. The poison consumed him.',
          '"Father Maren prayed for seven days. On the eighth, the curse answered his prayers instead."',
          '"The grass that survives here is sacred. It remembers what the world was. It refuses to die."',
        ],
        fireDepths: [
          'The eternal fire burns since the god departed. They say a piece of Matter lies in the flames.',
          '"The Elemental was born from the molten core of the world. It is pure fire and fury."',
          'The lava rose when the balance shattered. These platforms are all that remains.',
          '"A kingdom of dwarves lived beneath these rocks. The lava took them in a single night."',
          '"The Elemental screams not in rage, but in agony. It cannot stop burning. It never asked to exist."',
        ],
        shadowRuins: [
          'These ruins were the main temple. Here the god forged the original Neutral Matter.',
          '"The library holds secrets of past ages. The Specter guards the forbidden knowledge."',
          'Inscriptions describe the creation of Neutral Matter: nine fragments of pure divine power.',
          '"He who gathers the nine fragments may forge the weapon that slays gods."',
          'A note in the God\'s own handwriting: "I am sorry. I was not strong enough to watch them suffer."',
          '"Veyra chose to stay when the temple fell. Knowledge, she said, must never die. So neither did she."',
        ],
        dragonLair: [
          'The Ash Dragon... the divine creature that devours all. Only the divine weapon can stop it.',
          '"It was the guardian of this world. When the god departed, loneliness drove it mad."',
          'The last record says: "Do not blame it. It weeps as it burns everything."',
          '"Her name is Cindara. The God named her after the first sunrise. She was his favorite creation."',
          '"She waited at the gate for a thousand years. He never came back. The fire started on year one."',
        ],
      };
      const pool = lorePool[player.currentMap] || ['Ancient inscriptions cover the stone...'];
      const loreIdx = (loreTx * 7 + loreTy * 13) % pool.length;
      showDialog(pool[loreIdx]);
      return;
    }
    // Use flask
    const flaskIdx = player.inventory.findIndex(i => i.type === 'flask');
    if (flaskIdx >= 0 && player.hp < player.maxHp) {
      player.hp = Math.min(player.maxHp, player.hp + 20 + player.stats.vitality * 2);
      player.inventory.splice(flaskIdx, 1);
      addFloatText(player.x, player.y, '+Health', '#44ff44');
    }
  }

  // Pick up items
  for (let i = items.length-1; i >= 0; i--) {
    const item = items[i];
    if (Math.hypot(item.x-player.x, item.y-player.y) < 1) {
      if (item.type === 'ore') {
        player.inventory.push(item);
        addFloatText(player.x, player.y, '+'+item.name, '#ffcc00');
      } else if (item.type === 'ashes') {
        player.ashes += item.value;
        addFloatText(player.x, player.y, '+'+item.value+' Ashes', '#ffaa44');
      } else if (item.type === 'matter') {
        player.matterPieces[item.matterIndex] = true;
        player.matterCount++;
        // Inicia cutscene da materia neutra
        matterCutsceneTimer = 8.0;
        matterCutsceneIndex = item.matterIndex;
        gameState = STATE.MATTER_CUTSCENE;
      }
      items.splice(i, 1);
    }
  }

  // Check exits
  if (player.exitCooldown > 0) { player.exitCooldown -= dt; }
  else {
    for (const ex of activeExits) {
      if (Math.abs(player.x - ex.x) < 1.0 && Math.abs(player.y - ex.y) < 1.0) {
        player.exitCooldown = 1.5;
        const _ex = ex;
        showMathChallenge(() => { loadMap(_ex.target, _ex.tx, _ex.ty); }, _ex.target);
        return;
      }
    }
  }

  // Path hints near exits
  for (const ex of activeExits) {
    const exDist = Math.hypot(player.x - ex.x, player.y - ex.y);
    if (exDist < 5 && exDist > 1.5) {
      const hintKey = player.currentMap + '>' + ex.target;
      if (PATH_HINTS[hintKey]) {
        pathHintText = PATH_HINTS[hintKey];
        pathHintTimer = 2.0;
      }
      break;
    }
  }

  // Easter egg: secret stone in tutorial east alcove
  if (player.currentMap === 'tutorial' && !player.secretFound) {
    if (Math.hypot(player.x - 26, player.y - 15) < 1.5 && keys['q']) {
      keys['q'] = false;
      player.secretFound = true;
      player.stats.vitality = 99;
      player.stats.strength = 99;
      player.stats.dexterity = 99;
      player.stats.resistance = 99;
      player.level = 99;
      player.maxHp = 30 + 99 * 10;
      player.hp = player.maxHp;
      player.maxStamina = 30 + 99 * 5;
      player.stamina = player.maxStamina;
      player.ashes += 1000000;
      player.weaponLevel = 10;
      addFloatText(player.x, player.y, 'MAX POWER!', '#ffdd00');
      addShake(8, 0.3);
      for(let i=0;i<12;i++) addParticle(player.x*TILE+8, player.y*TILE+8, '#ffdd00', 0.8, (Math.random()-0.5)*5, -Math.random()*5, 1.5);
      return;
    }
  }

  // Quick flask use (Q key)
  if (keys['q']) {
    keys['q'] = false;
    const qi = player.inventory.findIndex(i => i.type === 'flask');
    if (qi >= 0 && player.hp < player.maxHp) {
      const healAmt = 20 + player.stats.vitality * 2;
      player.hp = Math.min(player.maxHp, player.hp + healAmt);
      player.inventory.splice(qi, 1);
      addFloatText(player.x, player.y, '+' + healAmt + ' HP', '#44ff44');
      for(let i=0;i<6;i++) addParticle(player.x*TILE+8, player.y*TILE+8, '#44ff44', 0.5, (Math.random()-0.5)*3, -Math.random()*3, 1);
    }
  }

  // Stamina regen
  player.staminaRegen += dt;
  if (player.staminaRegen > 0.5) {
    player.staminaRegen = 0;
    player.stamina = Math.min(player.maxStamina, player.stamina + 2);
  }

  // Invincibility
  if (player.invincible > 0) player.invincible -= dt;

  // Animation
  player.animTimer += dt;
  if (player.animTimer > 0.15) { player.animTimer = 0; player.animFrame = (player.animFrame+1)%4; }
}

// ==================== UPDATE ENEMIES ====================
function updateEnemies(dt) {
  const map = maps[player.currentMap];
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    // Hit flash
    if (e.hitTimer > 0) e.hitTimer -= dt;
    // Knockback
    if (Math.abs(e.vx)>0.1||Math.abs(e.vy)>0.1) {
      e.x += e.vx*dt; e.y += e.vy*dt;
      e.vx *= 0.9; e.vy *= 0.9;
    }

    // Death
    if (e.hp <= 0) {
      // Drop ashes
      items.push({ x:e.x, y:e.y, type:'ashes', value:e.xp, name:'Ashes', animTimer:0 });
      // Chance to drop ore
      if (Math.random() < 0.35) {
        const oreVal = e.drop==='ore_iron'?5:e.drop==='ore_gold'?15:30;
        const oreName = e.drop==='ore_iron'?'Iron Ore':e.drop==='ore_gold'?'Gold Ore':'Crystal';
        items.push({ x:e.x+0.3, y:e.y, type:'ore', value:oreVal, name:oreName, animTimer:0 });
      }
      // Vampires have a chance to drop flask
      if (e.type === 'vampire' && Math.random() < 0.15 && gameDifficulty !== 'hell') {
        items.push({ x:e.x-0.3, y:e.y, name:'Life Flask', type:'flask', value:20, animTimer:0 });
      }
      for(let j=0;j<10;j++) addParticle(e.x*TILE+8, e.y*TILE+8, e.color, 0.8);
      enemies.splice(i, 1);
      continue;
    }

    // AI
    const distToPlayer = Math.hypot(e.x-player.x, e.y-player.y);
    e.stateTimer -= dt;

    if (distToPlayer < e.aggroRange && !player.dead) {
      e.aggro = true;
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy);

      // Type-specific AI behaviors
      if (e.type === 'skull' && len > 2 && len < 5) {
        // Skulls circle the player, harder to hit
        const circAngle = Math.atan2(dy, dx) + Math.PI/2 + Math.sin(Date.now()/800+e.x)*0.5;
        const mx = Math.cos(circAngle) * e.speed * dt;
        const my = Math.sin(circAngle) * e.speed * dt;
        if (canWalk(map, e.x+mx+0.2, e.y+0.2)&&canWalk(map, e.x+mx+0.8, e.y+0.8)) e.x += mx;
        if (canWalk(map, e.x+0.2, e.y+my+0.2)&&canWalk(map, e.x+0.8, e.y+my+0.8)) e.y += my;
      } else if (e.type === 'vampire' && e.hp < e.maxHp * 0.4 && len < 3) {
        // Vampires retreat when low HP
        if (len > 0.3) {
          const mx = -(dx/len) * e.speed * dt * 1.3;
          const my = -(dy/len) * e.speed * dt * 1.3;
          if (canWalk(map, e.x+mx+0.2, e.y+0.2)&&canWalk(map, e.x+mx+0.8, e.y+0.8)) e.x += mx;
          if (canWalk(map, e.x+0.2, e.y+my+0.2)&&canWalk(map, e.x+0.8, e.y+my+0.8)) e.y += my;
        }
      } else if (len > 0.8) {
        // Default: chase player
        const mx = (dx/len) * e.speed * dt;
        const my = (dy/len) * e.speed * dt;
        if (canWalk(map, e.x+mx+0.2, e.y+0.2)&&canWalk(map, e.x+mx+0.8, e.y+0.8)) e.x += mx;
        if (canWalk(map, e.x+0.2, e.y+my+0.2)&&canWalk(map, e.x+0.8, e.y+my+0.8)) e.y += my;
      }

      // Attack player
      if (distToPlayer < 1.0 && e.stateTimer <= 0 && player.invincible <= 0) {
        const dmg = Math.max(1, e.dmg - getPlayerDefense());
        player.hp -= dmg;
        player.invincible = 0.5;
        addFloatText(player.x, player.y, '-'+dmg, '#ff0000');
        addShake(5, 0.15);
        for(let j=0;j<4;j++) addParticle(player.x*TILE+8, player.y*TILE+8, '#ff0000', 0.4);
        e.stateTimer = 0.8;
        if (player.hp <= 0) playerDeath();
      }
    } else {
      // Wander
      if (e.stateTimer <= 0) {
        e.stateTimer = 2 + Math.random()*3;
        e.vx = (Math.random()-0.5)*0.5; e.vy = (Math.random()-0.5)*0.5;
      }
      const wx = e.x + e.vx*dt*0.5, wy = e.y + e.vy*dt*0.5;
      if (canWalk(map, wx+0.3, wy+0.3)&&canWalk(map, wx+0.7, wy+0.7)) { e.x = wx; e.y = wy; }
    }

    // Facing
    if (player.x > e.x) e.facing = 3; else e.facing = 2;

    // Animation
    e.animTimer += dt;
    if (e.animTimer > 0.2) { e.animTimer = 0; e.animFrame = (e.animFrame+1)%4; }
  }
}

// ==================== UPDATE BOSSES ====================
function updateBosses(dt) {
  const map = maps[player.currentMap];
  for (let i = bosses.length-1; i >= 0; i--) {
    const b = bosses[i];
    if (b.hitTimer > 0) b.hitTimer -= dt;

    // Death — enter cinematic BOSS_DEATH state
    if (b.hp <= 0) {
      player.killedBosses.add(b.mapName);
      const ashReward = 100 + (b.isFinal ? 500 : player.killedBosses.size * 30);
      bossDeathData = {
        x: b.x, y: b.y, color: b.color, name: b.name,
        mapName: b.mapName, matterIndex: b.matterIndex,
        isFinal: b.isFinal, ashReward: ashReward,
        bossDeathLines: {
          ashWastes: 'The Ash Guardian crumbles to dust... "The city... I was supposed to protect the city. The people... are they safe?" Its stone eyes dim. It never learned they were already gone.',
          boneCaverns: 'Commander Aldric, the Bone Lord, falls to his knees... "Tell my daughter... Aldric kept his promise. I never abandoned my post." His bones scatter gently, as if relieved.',
          cursedGrounds: 'Father Maren\'s twisted form convulses... "The land... I can feel it healing already. My prayers... they were answered after all." The poison drains from his eyes. He smiles.',
          fireDepths: 'The Fire Elemental flickers and dims... "The burning... it stops? I can think again. I never wanted to hurt anyone. I just... couldn\'t stop." The flames go quiet.',
          shadowRuins: 'Veyra, the Specter, releases the forbidden tomes... "The library is yours now. Read the God\'s apology. He... truly loved this world. As did I." She fades into the pages she protected.',
          dragonLair: 'Cindara, the Ash Dragon, lowers her great head... "You smell like him. Like the God. I waited so long..." Her fire dies. "Tell him... I forgive him. I was never angry. Just lonely."',
        },
      };
      bossDeathTimer = 4.0;
      gameState = STATE.BOSS_DEATH;
      // Initial white flash + massive shake
      addShake(15, 0.6);
      for(let j=0;j<40;j++) addParticle(b.x*TILE+8, b.y*TILE+8, b.color, 2.0, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 3);
      bosses.splice(i, 1);
      continue;
    }

    // Boss AI
    const distToPlayer = Math.hypot(b.x-player.x, b.y-player.y);
    b.animTimer += dt;
    if (b.animTimer > 0.2) { b.animTimer = 0; b.animFrame = (b.animFrame+1)%4; }

    // Phase change
    if (b.hp < b.maxHp * 0.5 && b.phase === 0) { b.phase = 1; b.speed *= 1.3; b.dmg = Math.floor(b.dmg*1.2); }

    // Movement: chase player
    if (distToPlayer > 1.5) {
      const dx = player.x-b.x, dy = player.y-b.y;
      const len = Math.hypot(dx,dy);
      const mx = (dx/len)*b.speed*dt, my = (dy/len)*b.speed*dt;
      if (canWalk(map, b.x+mx, b.y)) b.x += mx;
      if (canWalk(map, b.x, b.y+my)) b.y += my;
    }

    // Special attacks (varied per boss type)
    b.specialTimer -= dt;
    if (b.specialTimer <= 0 && !b.charging) {
      b.specialTimer = b.phase === 1 ? 3 : 5;
      const dx = player.x-b.x, dy = player.y-b.y;
      const len = Math.hypot(dx,dy)||1;

      if (b.isFinal) {
        // Dragon: alternates charge and fire burst
        if (Math.random() < 0.5) {
          b.charging = true; b.chargeTimer = 0.6;
          b.vx = (dx/len)*10; b.vy = (dy/len)*10;
          addShake(6, 0.3);
        } else {
          // Fire burst: ring of particles
          for(let j=0;j<16;j++) {
            const a = j*Math.PI/8;
            addParticle(b.x*TILE+8, b.y*TILE+8, '#ff4400', 0.8, Math.cos(a)*5, Math.sin(a)*5, 2);
          }
          addShake(4, 0.2);
          // Damage nearby
          if (distToPlayer < 3 && player.invincible <= 0) {
            player.hp -= Math.max(1, Math.floor(b.dmg*0.5) - getPlayerDefense());
            player.invincible = 0.5;
            addFloatText(player.x, player.y, 'QUEIMADURA!', '#ff6600');
          }
        }
      } else if (b.sprite === 'skull' || b.sprite === 'skull2') {
        // Skulls: teleport behind player
        const behindX = player.x + (player.facing===3?-2:player.facing===2?2:0);
        const behindY = player.y + (player.facing===0?-2:player.facing===1?2:0);
        if (canWalk(map, behindX+0.3, behindY+0.3)&&canWalk(map, behindX+0.7, behindY+0.7)) {
          for(let j=0;j<8;j++) addParticle(b.x*TILE+8, b.y*TILE+8, '#aa66ff', 0.5);
          b.x = behindX; b.y = behindY;
          for(let j=0;j<8;j++) addParticle(b.x*TILE+8, b.y*TILE+8, '#aa66ff', 0.5);
        }
      } else {
        // Default: charge attack
        b.charging = true; b.chargeTimer = 0.5;
        b.vx = (dx/len)*8; b.vy = (dy/len)*8;
        addShake(4, 0.15);
      }
    }
    if (b.charging) {
      b.chargeTimer -= dt;
      b.x += b.vx*dt; b.y += b.vy*dt;
      for(let j=0;j<2;j++) addParticle(b.x*TILE+8, b.y*TILE+8, b.color, 0.3);
      if (b.chargeTimer <= 0) { b.charging = false; b.vx=0; b.vy=0; }
    }

    // Attack player
    b.attackTimer -= dt;
    if (distToPlayer < 2 && b.attackTimer <= 0 && player.invincible <= 0) {
      const dmg = Math.max(1, b.dmg - getPlayerDefense());
      player.hp -= dmg;
      player.invincible = 0.8;
      addFloatText(player.x, player.y, '-'+dmg, '#ff0000');
      addShake(8, 0.2);
      for(let j=0;j<6;j++) addParticle(player.x*TILE+8, player.y*TILE+8, '#ff2200', 0.5);
      b.attackTimer = 1.2;
      if (player.hp <= 0) playerDeath();
    }

    // Facing
    b.facing = player.x > b.x ? 3 : 2;
  }

  // Check if player near boss door area - spawn boss (uses cached position)
  if (bosses.length === 0 && BOSS_DATA[player.currentMap] && !player.killedBosses.has(player.currentMap)) {
    const map = maps[player.currentMap];
    if (map._bossDoorX >= 0 && Math.hypot(player.x - map._bossDoorX, player.y - map._bossDoorY) < 6) {
      const _mapName = player.currentMap;
      showMathChallenge(() => {
        spawnBoss(_mapName);
        gameState = STATE.BOSS_INTRO;
        stateTimer = 3;
      });
      return;
    }
  }
}

// ==================== PLAYER DEATH ====================
function playerDeath() {
  player.dead = true;
  player.deaths++;
  gameState = STATE.GAME_OVER;
  stateTimer = 3;
  for(let i=0;i<20;i++) addParticle(player.x*TILE+8, player.y*TILE+8, '#ff0000', 1.5);
}

function respawnPlayer() {
  player.dead = false;
  player.hp = player.maxHp;
  player.stamina = player.maxStamina;
  player.ashes = Math.floor(player.ashes * 0.7); // Lose 30% ashes on death
  loadMap(player.lastBonfire.map, player.lastBonfire.x, player.lastBonfire.y);
  gameState = (!player.tutorialDone && player.currentMap==='tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY;
}

// ==================== DIALOG ====================
function showDialog(text, callback) {
  dialogText = text;
  dialogCallback = callback;
  gameState = STATE.DIALOG;
}

// ==================== LEVELING ====================
function getLevelCost(stat) {
  return 20 + player.stats[stat] * 15;
}
function levelUp(stat) {
  const cost = getLevelCost(stat);
  if (player.ashes >= cost) {
    player.ashes -= cost;
    player.stats[stat]++;
    player.level++;
    // Recalculate max hp/stamina
    player.maxHp = 30 + player.stats.vitality * 10;
    player.maxStamina = 30 + player.stats.vitality * 5;
    player.hp = player.maxHp;
    player.stamina = player.maxStamina;
    addFloatText(player.x, player.y, 'Level Up!', '#ffff00');
  }
}

// ==================== MATH CHALLENGE SYSTEM ====================
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateMathProblem(tier) {
  let question, answer;
  switch (tier) {
    case 1: { // Soma/subtracao ate 100
      const op = Math.random() < 0.5 ? '+' : '-';
      if (op === '+') {
        const a = randInt(1, 50), b = randInt(1, 50);
        question = a + ' + ' + b; answer = a + b;
      } else {
        const a = randInt(20, 99), b = randInt(1, a);
        question = a + ' - ' + b; answer = a - b;
      }
      break;
    }
    case 2: { // Tabuada 2-9
      const a = randInt(2, 9), b = randInt(2, 9);
      question = a + ' x ' + b; answer = a * b;
      break;
    }
    case 3: { // Divisao exata + operacoes mistas
      if (Math.random() < 0.5) {
        const b = randInt(2, 9), ans = randInt(2, 12), a = b * ans;
        question = a + ' / ' + b; answer = ans;
      } else {
        const a = randInt(5, 30), b = randInt(2, 9), c = randInt(1, 20);
        const op = Math.random() < 0.5 ? '+' : '-';
        if (op === '+') { question = a + ' x ' + b + ' + ' + c; answer = a * b + c; }
        else { question = a + ' x ' + b + ' - ' + c; answer = a * b - c; }
      }
      break;
    }
    case 4: { // Fracoes simples (resposta inteira ou decimal simples)
      const denom = [2, 4, 5, 10][randInt(0, 3)];
      const mult = randInt(1, 5);
      const numer = denom * mult + [0, denom / 2][randInt(0, 1)];
      question = numer + ' / ' + denom;
      answer = numer / denom;
      break;
    }
    case 5: { // Porcentagens e decimais
      const pcts = [10, 20, 25, 50, 75];
      const pct = pcts[randInt(0, pcts.length - 1)];
      const base = randInt(2, 20) * 10;
      question = pct + '% of ' + base;
      answer = pct * base / 100;
      break;
    }
    case 6: { // Ordem das operacoes, potencias
      if (Math.random() < 0.5) {
        const a = randInt(2, 10), b = randInt(1, 5), c = randInt(1, 10);
        question = a + ' + ' + b + ' x ' + c;
        answer = a + b * c;
      } else {
        const base = randInt(2, 6), exp = randInt(2, 3);
        question = base + '^' + exp;
        answer = Math.pow(base, exp);
      }
      break;
    }
    case 7: { // Equacoes simples (resolver x)
      const a = randInt(2, 9), b = randInt(1, 20), c = randInt(10, 50);
      // a*x + b = c  =>  x = (c-b)/a, ensure integer answer
      const xVal = randInt(1, 8);
      const result = a * xVal + b;
      question = a + 'x + ' + b + ' = ' + result + '  (x = ?)';
      answer = xVal;
      break;
    }
    default: {
      const a = randInt(1, 20), b = randInt(1, 20);
      question = a + ' + ' + b; answer = a + b;
    }
  }
  return { question, answer, tierName: MATH_TIER_NAMES[tier] || 'Math' };
}

function showMathChallenge(callback, mapOverride) {
  if (player.secretFound) { if (callback) callback(); return; }
  const area = mapOverride || player.currentMap;
  const tier = Math.min(MATH_TIER[area] || 1, mathYear);
  mathProblem = generateMathProblem(tier);
  mathInput = '';
  mathCallback = callback;
  mathResult = null;
  mathResultTimer = 0;
  mathAttempts = 0;
  mathInputBuffer = [];
  mathPrevState = gameState;
  gameState = STATE.MATH;
}

function updateMath() {
  // Process buffered keys
  for (const key of mathInputBuffer) {
    if (mathResult === 'correct') continue; // ignore input during success display

    if (mathResult === 'wrong') {
      // After wrong answer, any key clears and retries
      mathResult = null;
      mathResultTimer = 0;
      if (mathAttempts >= 3) {
        mathProblem = generateMathProblem(Math.min(MATH_TIER[player.currentMap] || 1, mathYear));
        mathAttempts = 0;
      }
      mathInput = '';
      continue;
    }

    if (key === 'Escape') {
      gameState = mathPrevState;
      mathProblem = null;
      mathCallback = null;
      mathResult = null;
      mathInputBuffer = [];
      keys['escape'] = false;
      keys['enter'] = false;
      keys['f'] = false;
      return;
    }
    if (key === 'Backspace') {
      mathInput = mathInput.slice(0, -1);
    } else if (key === 'Enter') {
      if (mathInput.length > 0) {
        const userAnswer = parseFloat(mathInput);
        if (!isNaN(userAnswer) && Math.abs(userAnswer - mathProblem.answer) < 0.01) {
          // Correct
          mathResult = 'correct';
          mathResultTimer = 0;
          const tier = Math.min(MATH_TIER[player.currentMap] || 1, mathYear);
          const bonus = 5 + tier * 3;
          player.ashes += bonus;
          addFloatText(player.x, player.y, '+' + bonus + ' Ashes (Math)', '#44ddff');
        } else {
          // Wrong
          mathResult = 'wrong';
          mathResultTimer = 1.5;
          mathAttempts++;
          const tier2 = Math.min(MATH_TIER[player.currentMap] || 1, mathYear);
          const dmg = 3 + tier2 * 2;
          player.hp -= dmg;
          addFloatText(player.x, player.y, '-' + dmg + ' HP', '#ff4444');
          if (player.hp <= 0) {
            player.hp = 1; // Don't kill from math, leave at 1 HP
          }
        }
      }
    } else if ((key >= '0' && key <= '9') || key === '-' || key === '.' || key === ',') {
      if (key === ',') mathInput += '.';
      else if (mathInput.length < 10) mathInput += key;
    }
  }
  mathInputBuffer = [];

  // Handle result timers
  if (mathResult === 'correct') {
    mathResultTimer -= dt;
    if (mathResultTimer <= 0) {
      const cb = mathCallback;
      gameState = mathPrevState;
      mathProblem = null;
      mathCallback = null;
      mathResult = null;
      // Clear all keys to prevent leaking into next state
      keys['enter'] = false;
      keys['escape'] = false;
      keys['f'] = false;
      if (cb) cb();
    }
  }
}

function drawMath() {
  if (!mathProblem) return;
  // Draw game behind
  const map = maps[player.currentMap];
  if (map) {
    updateCamera(player, map.width, map.height);
    drawMap(); drawExits(); drawBonfires(); drawItems(); drawChests(); drawNPCs();
    drawEnemies(); drawBosses(); drawPlayer(); drawLighting(); drawHUD();
  }

  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, CW, CH);

  // Panel
  const pw = 500, ph = 300;
  const px = CW / 2 - pw / 2, py = CH / 2 - ph / 2;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(px + 4, py + 4, pw, ph);

  // Parchment background
  const parchGrad = ctx.createLinearGradient(px, py, px, py + ph);
  parchGrad.addColorStop(0, '#2a2218');
  parchGrad.addColorStop(0.5, '#1e1812');
  parchGrad.addColorStop(1, '#2a2218');
  ctx.fillStyle = parchGrad;
  ctx.fillRect(px, py, pw, ph);

  // Border - double line
  ctx.strokeStyle = '#5a4a30'; ctx.lineWidth = 2;
  ctx.strokeRect(px, py, pw, ph);
  ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 1;
  ctx.strokeRect(px + 4, py + 4, pw - 8, ph - 8);

  // Corner ornaments
  const corners = [[px, py], [px + pw, py], [px, py + ph], [px + pw, py + ph]];
  ctx.fillStyle = '#6a5530';
  for (const [cx, cy] of corners) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }

  ctx.textAlign = 'center';

  // Tier title
  ctx.fillStyle = '#aa8855'; ctx.font = 'bold 14px monospace';
  ctx.fillText('MATH CHALLENGE', CW / 2, py + 35);
  ctx.fillStyle = '#887755'; ctx.font = '12px monospace';
  ctx.fillText(mathProblem.tierName, CW / 2, py + 55);

  // Separator
  ctx.fillStyle = '#3a2a15'; ctx.fillRect(CW / 2 - 100, py + 62, 200, 1);

  // Question
  ctx.fillStyle = '#eeddcc'; ctx.font = 'bold 28px monospace';
  ctx.fillText(mathProblem.question, CW / 2, py + 110);

  // Input field
  const ifW = 200, ifH = 40;
  const ifX = CW / 2 - ifW / 2, ifY = py + 135;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(ifX, ifY, ifW, ifH);
  ctx.strokeStyle = '#5a4a30'; ctx.lineWidth = 1;
  ctx.strokeRect(ifX, ifY, ifW, ifH);

  // Input text
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px monospace';
  const cursor = Math.sin(Date.now() / 400) > 0 ? '|' : '';
  ctx.fillText(mathInput + cursor, CW / 2, ifY + 28);

  // Result feedback
  if (mathResult === 'correct') {
    ctx.fillStyle = '#44dd66'; ctx.font = 'bold 20px monospace';
    ctx.fillText('Correct!', CW / 2, py + 220);
  } else if (mathResult === 'wrong') {
    ctx.fillStyle = '#dd4444'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Wrong! Answer: ' + mathProblem.answer, CW / 2, py + 220);
    ctx.fillStyle = '#aa6644'; ctx.font = '12px monospace';
    ctx.fillText('Attempt ' + mathAttempts + '/3 — Press any key', CW / 2, py + 242);
  }

  // Controls hint
  ctx.fillStyle = '#665544'; ctx.font = '11px monospace';
  ctx.fillText('ENTER  Confirm  |  ESC  Cancel', CW / 2, py + ph - 18);
}

// ==================== DRAW TILE ====================
function drawTile(tileType, x, y) {
  const px = x * TILE * SCALE - camera.x;
  const py = y * TILE * SCALE - camera.y;
  if (px < -TILE*SCALE || px > CW || py < -TILE*SCALE || py > CH) return;

  const uv = TILE_UV[tileType];
  if (!uv) return;

  if (tileType === 8) {
    // Bonfire - so desenha o chao aqui, fogo e desenhado separado em drawBonfires()
    drawTile(2, x, y);
    return;
  }
  if (tileType === 9) {
    // Chest - drawn separately
    drawTile(2, x, y);
    return;
  }
  if (tileType === 15 || tileType === 16) {
    drawTile(2, x, y);
    return;
  }
  if (tileType === 11) {
    // Exit - draw floor underneath
    drawTile(2, x, y);
    return;
  }
  // Spike trap - animated
  if (tileType === 21) {
    drawTile(2, x, y);
    const spkPhase = Math.sin(Date.now() / 500 + x * 3 + y * 7);
    const spkAlpha = 0.4 + spkPhase * 0.3;
    ctx.fillStyle = 'rgba(120,100,100,' + spkAlpha + ')';
    const s = TILE * SCALE;
    // Draw spike pattern
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const sx2 = px + 4 + i * 14, sy2 = py + 4 + j * 14;
      ctx.beginPath(); ctx.moveTo(sx2, sy2 + 8); ctx.lineTo(sx2 + 4, sy2); ctx.lineTo(sx2 + 8, sy2 + 8); ctx.fill();
    }
    return;
  }
  // Lava - animated glow
  if (tileType === 22) {
    const lavaPhase = Math.sin(Date.now() / 800 + x * 2.3 + y * 1.7);
    const r = 180 + Math.floor(lavaPhase * 30);
    const g = 60 + Math.floor(lavaPhase * 20);
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',0)';
    ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    // Bubble effect
    if (Math.sin(Date.now() / 300 + x * 5 + y * 11) > 0.8) {
      ctx.fillStyle = 'rgba(255,200,50,0.4)';
      ctx.beginPath(); ctx.arc(px + 20 + lavaPhase * 8, py + 20 + lavaPhase * 6, 4, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }
  // Grass
  if (tileType === 23) {
    drawTile(12, x, y); // cursed floor base
    ctx.fillStyle = 'rgba(60,90,40,0.3)';
    ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    // Grass blades
    ctx.strokeStyle = 'rgba(80,120,50,0.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const gx = px + 6 + ((x * 3 + i * 11) % 30);
      const gy = py + TILE * SCALE - 2;
      const sway = Math.sin(Date.now() / 1000 + x + i) * 3;
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + sway, gy - 12 - (i % 3) * 4); ctx.stroke();
    }
    return;
  }
  // Lore tablet
  if (tileType === 25) {
    drawTile(2, x, y);
    // Stone tablet
    ctx.fillStyle = '#667788';
    ctx.fillRect(px + 10, py + 6, 28, 34);
    ctx.fillStyle = '#556677';
    ctx.fillRect(px + 12, py + 8, 24, 30);
    // Glowing runes
    const glowPhase = Math.sin(Date.now() / 600 + x + y);
    ctx.fillStyle = 'rgba(130,170,220,' + (0.4 + glowPhase * 0.3) + ')';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(px + 16, py + 12 + i * 9, 16, 2);
    }
    // Glow
    ctx.save();
    ctx.shadowColor = '#6688bb'; ctx.shadowBlur = 8 + glowPhase * 4;
    ctx.fillStyle = 'rgba(100,140,200,0.1)';
    ctx.fillRect(px + 14, py + 10, 20, 26);
    ctx.restore();
    return;
  }
  // Rubble
  if (tileType === 24) {
    drawTile(2, x, y);
    const isSecret = player.currentMap === 'tutorial' && x === 26 && y === 15 && !player.secretFound;
    ctx.fillStyle = isSecret ? '#8b2020' : '#5a4a40';
    // Random rubble pieces based on position
    const seed = x * 7 + y * 13;
    for (let i = 0; i < 4; i++) {
      const rx = px + ((seed + i * 17) % 30) + 4;
      const ry = py + ((seed + i * 23) % 30) + 4;
      const rs = 4 + (seed + i) % 6;
      ctx.fillRect(rx, ry, rs, rs - 1);
    }
    if (isSecret) {
      ctx.fillStyle = 'rgba(255,50,30,' + (0.15 + Math.sin(Date.now() / 400) * 0.1) + ')';
      ctx.fillRect(px, py, TILE * SCALE, TILE * SCALE);
    }
    return;
  }

  if (uv.img && images[uv.img]) {
    ctx.drawImage(images[uv.img], uv.sx, uv.sy, uv.sw, uv.sh, px, py, TILE*SCALE, TILE*SCALE);
    // Apply tint overlay for themed floors
    if (uv.tint) {
      ctx.fillStyle = uv.tint;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
      ctx.globalAlpha = 1.0;
    }
    // Subtle brightness variation based on position hash for floor tiles
    if (tileType === 1 || tileType === 2 || tileType === 12 || tileType === 13) {
      const hash = ((x * 7 + y * 13) % 5);
      if (hash === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
      } else if (hash === 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
      }
    }
    // Wall edge details for depth
    if (tileType === 3 || tileType === 4) {
      const s = TILE * SCALE;
      // Top highlight (light catches top edge)
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(px, py, s, 1);
      // Bottom shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(px, py + s - 1, s, 1);
      // Position-seeded crack lines
      const seed = (x * 31 + y * 17) % 7;
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      if (seed < 3) {
        ctx.beginPath();
        ctx.moveTo(px + seed * 8 + 4, py + 6);
        ctx.lineTo(px + seed * 8 + 12, py + s - 8);
        ctx.stroke();
      }
      if (seed === 4 || seed === 5) {
        ctx.beginPath();
        ctx.moveTo(px + 6, py + seed * 5 + 2);
        ctx.lineTo(px + s - 6, py + seed * 5 + 6);
        ctx.stroke();
      }
      // Extra dark bottom for wall_top tiles
      if (tileType === 4) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(px, py + s - 3, s, 3);
      }
    }
  } else if (uv.color) {
    ctx.fillStyle = uv.color;
    ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    // Subtle variation for solid color tiles
    const hash = ((x * 7 + y * 13) % 4);
    if (hash === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    } else if (hash === 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.04)';
      ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    }
    // Wall edge details for color-based walls
    if (tileType === 3 || tileType === 4) {
      const s = TILE * SCALE;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(px, py, s, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(px, py + s - 1, s, 1);
      if (tileType === 4) {
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(px, py + s - 3, s, 3);
      }
    }
  }
}

// Desenha TODAS as fogueiras como entidades (nao dependem de drawTile/culling)
function drawBonfires() {
  for (const b of bonfires) {
    const px = b.x * TILE * SCALE - camera.x;
    const py = b.y * TILE * SCALE - camera.y;
    const centerX = px + TILE*SCALE/2;
    const centerY = py + TILE*SCALE/2;

    // GLOW grande visivel de longe (mesmo fora da tela parcialmente)
    ctx.save();
    const glowR = 6 * TILE * SCALE;
    const flicker = 1 + Math.sin(Date.now()/200)*0.1;
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowR * flicker);
    grad.addColorStop(0, 'rgba(255,140,40,0.25)');
    grad.addColorStop(0.3, 'rgba(255,100,20,0.1)');
    grad.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(centerX - glowR, centerY - glowR, glowR*2, glowR*2);
    ctx.restore();

    // So desenha o fogo detalhado se estiver na tela
    if (px > -TILE*SCALE*3 && px < CW+TILE*SCALE*3 && py > -TILE*SCALE*3 && py < CH+TILE*SCALE*3) {
      // Animated fire sprite from fire_animation.png (row 2 = large bonfire, 44x48 per frame)
      const fireImg = images['fire'];
      if (fireImg) {
        const frame = Math.floor(Date.now()/180) % 4;
        const fw = 44, fh = 48;
        const drawW = fw / 16 * TILE * SCALE * 0.8;
        const drawH = fh / 16 * TILE * SCALE * 0.8;
        ctx.drawImage(fireImg, frame * fw, 96, fw, fh, px + TILE*SCALE/2 - drawW/2, py - drawH * 0.4, drawW, drawH);
      } else {
        // Fallback hand-drawn fire
        const f = Math.sin(Date.now()/100)*2;
        ctx.save();
        ctx.shadowColor = '#ff8833'; ctx.shadowBlur = 25;
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(px+2*SCALE, py+8*SCALE, 12*SCALE, 4*SCALE);
        ctx.fillStyle = '#ff6600';
        ctx.fillRect(px+3*SCALE, py-f*SCALE, 10*SCALE, 14*SCALE);
        ctx.fillStyle = '#ffcc22';
        ctx.fillRect(px+5*SCALE, py-f*SCALE+2*SCALE, 6*SCALE, 10*SCALE);
        ctx.fillStyle = '#ffffaa';
        ctx.fillRect(px+6*SCALE, py-f*SCALE+4*SCALE, 4*SCALE, 6*SCALE);
        ctx.restore();
      }

      // Spark particles
      if (Math.random() < 0.3) {
        addParticle(b.x*TILE+8, b.y*TILE+4, '#ffcc44', 0.5, (Math.random()-0.5)*1.5, -(Math.random()*2+1), 1);
      }
    }

    // Texto de interacao
    const dist = Math.hypot(b.x - player.x, b.y - player.y);
    if (dist < 2) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(centerX-60, py-28, 120, 20);
      ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ffdd66';
      ctx.fillText('[F] Rest', centerX, py-13);
    }
  }
}

// ==================== DRAW EXITS (ESCADAS) ====================
function drawExits() {
  for (const ex of activeExits) {
    const px = ex.x * TILE * SCALE - camera.x;
    const py = ex.y * TILE * SCALE - camera.y;
    const centerX = px + TILE*SCALE/2;
    const centerY = py + TILE*SCALE/2;

    // Draw stairs using Objects.png sprite (stairs at 0,0 in objects sheet)
    const objImg = images['objects'];
    if (objImg) {
      // Draw 3 rows of stair sprites (16x16 each) stacked, col 0
      ctx.drawImage(objImg, 0, 0, 16, 16, px, py - TILE * SCALE, TILE * SCALE, TILE * SCALE);
      ctx.drawImage(objImg, 0, 16, 16, 16, px, py, TILE * SCALE, TILE * SCALE);
    } else {
      const s = SCALE;
      ctx.fillStyle = '#554433';
      ctx.fillRect(px+2*s, py+1*s, 12*s, 14*s);
      ctx.fillStyle = '#887766';
      for (let i = 0; i < 5; i++) ctx.fillRect(px+3*s, py+(2+i*3)*s, 10*s, 2*s);
      ctx.fillStyle = '#665544';
      ctx.fillRect(px+2*s, py+1*s, 2*s, 14*s);
      ctx.fillRect(px+12*s, py+1*s, 2*s, 14*s);
    }

    // Glow verde pulsante
    ctx.save();
    const pulse = 0.5 + Math.sin(Date.now()/400)*0.3;
    const glowR = 3 * TILE * SCALE;
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowR);
    grad.addColorStop(0, `rgba(80,255,80,${0.15*pulse})`);
    grad.addColorStop(1, 'rgba(80,255,80,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(centerX-glowR, centerY-glowR, glowR*2, glowR*2);
    ctx.restore();

    // Seta animada apontando para a saida
    const arrowBob = Math.sin(Date.now()/300) * 4;
    ctx.fillStyle = '#44ff44';
    ctx.beginPath();
    ctx.moveTo(centerX, py - 10 + arrowBob);
    ctx.lineTo(centerX - 8, py - 20 + arrowBob);
    ctx.lineTo(centerX + 8, py - 20 + arrowBob);
    ctx.fill();

    // Texto do destino
    const dist = Math.hypot(ex.x - player.x, ex.y - player.y);
    const mapNames = {
      tutorial:'Tutorial Cave', ashWastes:'Ash Wastes',
      boneCaverns:'Bone Caverns', cursedGrounds:'Cursed Grounds',
      fireDepths:'Fire Depths', shadowRuins:'Shadow Ruins',
      dragonLair:'Dragon Lair'
    };
    const destName = mapNames[ex.target] || ex.target;

    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const tw = ctx.measureText(destName).width + 16;
    ctx.fillRect(centerX - tw/2, py - 38, tw, 16);
    ctx.fillStyle = '#88ff88';
    ctx.fillText(destName, centerX, py - 26);

    // Dica quando perto
    if (dist < 3) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(centerX - 80, py - 56, 160, 18);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace';
      ctx.fillText('Walk here to enter!', centerX, py - 43);
    }
  }
}

// ==================== DRAW MAP ====================
function drawMap() {
  // Fundo claro em vez de preto
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CW, CH);

  const map = maps[player.currentMap];
  const startX = Math.max(0, Math.floor(camera.x / (TILE*SCALE)) - 1);
  const startY = Math.max(0, Math.floor(camera.y / (TILE*SCALE)) - 1);
  const endX = Math.min(map.width, startX + Math.ceil(CW/(TILE*SCALE)) + 2);
  const endY = Math.min(map.height, startY + Math.ceil(CH/(TILE*SCALE)) + 2);

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const tile = getTile(map, x, y);
      if (tile === 0) {
        // Desenha vazio com cor escura visivel em vez de nada
        const px = x*TILE*SCALE - camera.x;
        const py = y*TILE*SCALE - camera.y;
        ctx.fillStyle = '#111122';
        ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
        continue;
      }
      drawTile(tile, x, y);
    }
  }
}

// ==================== DRAW ENTITIES ====================
function drawSprite16(imgName, frameNum, x, y, flipX, tint) {
  const img = images[imgName + '_' + (frameNum+1)];
  const px = x * TILE * SCALE - camera.x;
  const py = y * TILE * SCALE - camera.y;
  if (px < -32*SCALE || px > CW+32 || py < -32*SCALE || py > CH+32) return;

  if (tint) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = tint;
    ctx.fillRect(px, py, TILE*SCALE, TILE*SCALE);
    ctx.globalAlpha = 1;
  }
  if (img) {
    ctx.save();
    if (flipX) {
      ctx.translate(px + TILE*SCALE, py);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, 16, 16, 0, 0, TILE*SCALE, TILE*SCALE);
    } else {
      ctx.drawImage(img, 0, 0, 16, 16, px, py, TILE*SCALE, TILE*SCALE);
    }
    ctx.restore();
  } else {
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(px+4*SCALE, py+4*SCALE, 8*SCALE, 8*SCALE);
  }
}

function drawPlayer() {
  if (player.dead) return;
  const px = player.x * TILE * SCALE - camera.x;
  const py = player.y * TILE * SCALE - camera.y;

  // Invincibility flash
  if (player.invincible > 0 && Math.floor(player.invincible*10)%2===0) return;

  // Dodge trail effect
  if (player.dodging) {
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#6688cc';
    ctx.fillRect(px+2*SCALE, py+2*SCALE, 12*SCALE, 13*SCALE);
    ctx.globalAlpha = 1;
  }

  // Character sprite: col 0 (single character), rows 0-3 for animation
  const img = images['character'];
  const flipX = (player.facing === 2);
  const isWalking = (keys['w']||keys['a']||keys['s']||keys['d']||keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright']);
  const walkBob = isWalking ? Math.sin(player.walkFrame * 2) * 1.5 * SCALE : 0;
  const animRow = 0;

  if (img) {
    ctx.save();
    // Weapon glow ring under player
    if (player.weapon) {
      const glowColor = player.weapon === 'sword' ? 'rgba(60,120,220,' : 'rgba(160,100,40,';
      const pulse = 0.08 + Math.sin(Date.now() / 500) * 0.04;
      ctx.fillStyle = glowColor + pulse + ')';
      ctx.beginPath();
      ctx.ellipse(px + TILE*SCALE/2, py + TILE*SCALE - SCALE, 10*SCALE, 4*SCALE, 0, 0, Math.PI*2);
      ctx.fill();
    }
    // Shadow under player
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(px + TILE*SCALE/2, py + TILE*SCALE - SCALE, 8*SCALE, 3*SCALE, 0, 0, Math.PI*2);
    ctx.fill();
    // Character sprite: col 0, row = animRow
    if (flipX) {
      ctx.translate(px + TILE*SCALE, py + walkBob);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, animRow * 16, 16, 16, 0, 0, TILE*SCALE, TILE*SCALE);
    } else {
      ctx.drawImage(img, 0, animRow * 16, 16, 16, px, py + walkBob, TILE*SCALE, TILE*SCALE);
    }
    ctx.restore();
  } else {
    // Fallback: personagem desenhado a mao
    ctx.save();
    if (flipX) { ctx.translate(px + TILE*SCALE, py + walkBob); ctx.scale(-1,1); } else { ctx.translate(px, py + walkBob); }
    // Corpo (armadura azul)
    ctx.fillStyle = '#4477bb';
    ctx.fillRect(3*SCALE, 5*SCALE, 10*SCALE, 9*SCALE);
    // Armadura detalhe
    ctx.fillStyle = '#5588cc';
    ctx.fillRect(4*SCALE, 6*SCALE, 8*SCALE, 4*SCALE);
    // Cinto
    ctx.fillStyle = '#664422';
    ctx.fillRect(4*SCALE, 10*SCALE, 8*SCALE, 1*SCALE);
    // Cabeca
    ctx.fillStyle = '#ffddaa';
    ctx.fillRect(4*SCALE, 0, 8*SCALE, 6*SCALE);
    // Cabelo
    ctx.fillStyle = '#553322';
    ctx.fillRect(4*SCALE, 0, 8*SCALE, 2*SCALE);
    ctx.fillRect(3*SCALE, 1*SCALE, 2*SCALE, 2*SCALE);
    // Olhos
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(6*SCALE, 2*SCALE, 2*SCALE, 2*SCALE);
    ctx.fillRect(9*SCALE, 2*SCALE, 2*SCALE, 2*SCALE);
    ctx.fillStyle = '#222222';
    ctx.fillRect(7*SCALE, 3*SCALE, 1*SCALE, 1*SCALE);
    ctx.fillRect(10*SCALE, 3*SCALE, 1*SCALE, 1*SCALE);
    // Pernas (anima so quando anda)
    const legOff = isWalking ? Math.sin(player.walkFrame*2)*2*SCALE : 0;
    ctx.fillStyle = '#335588';
    ctx.fillRect(4*SCALE, 13*SCALE+legOff, 4*SCALE, 3*SCALE);
    ctx.fillRect(8*SCALE, 13*SCALE-legOff, 4*SCALE, 3*SCALE);
    // Botas
    ctx.fillStyle = '#443322';
    ctx.fillRect(4*SCALE, 15*SCALE+legOff, 4*SCALE, 1*SCALE);
    ctx.fillRect(8*SCALE, 15*SCALE-legOff, 4*SCALE, 1*SCALE);
    ctx.restore();
  }

  // Draw weapon (sempre visivel quando tem arma, destaque quando ataca)
  if (player.weapon) {
    ctx.save();
    const isSword = player.weapon === 'sword';
    const baseColor = isSword ? '#99bbee' : '#aa8855';
    const brightColor = isSword ? '#ccddff' : '#ddaa66';
    const attacking = player.attacking;

    if (attacking) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12; }

    const wx = px + (player.facing===3?TILE*SCALE:player.facing===2?-6*SCALE:5*SCALE);
    const wy = py + (player.facing===0?TILE*SCALE-2*SCALE:player.facing===1?-6*SCALE:3*SCALE);

    ctx.fillStyle = attacking ? brightColor : baseColor;
    ctx.globalAlpha = attacking ? 1 : 0.7;

    if (isSword) {
      // Espada
      if (player.facing===0||player.facing===1) {
        ctx.fillRect(wx, wy, 3*SCALE, attacking?14*SCALE:10*SCALE);
        ctx.fillRect(wx-2*SCALE, wy+(attacking?0:6*SCALE), 7*SCALE, 2*SCALE); // guarda
      } else {
        ctx.fillRect(wx, wy, attacking?14*SCALE:10*SCALE, 3*SCALE);
        ctx.fillRect(wx+(attacking?0:6*SCALE), wy-2*SCALE, 2*SCALE, 7*SCALE);
      }
    } else {
      // Machado
      if (player.facing===0||player.facing===1) {
        ctx.fillRect(wx+1*SCALE, wy, 2*SCALE, attacking?14*SCALE:10*SCALE); // cabo
        ctx.fillStyle = '#887766';
        ctx.fillRect(wx-2*SCALE, wy, 8*SCALE, 5*SCALE); // cabeca machado
      } else {
        ctx.fillRect(wx, wy+1*SCALE, attacking?14*SCALE:10*SCALE, 2*SCALE);
        ctx.fillStyle = '#887766';
        ctx.fillRect(wx, wy-2*SCALE, 5*SCALE, 8*SCALE);
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const flipX = e.facing === 2;
    const px = e.x*TILE*SCALE - camera.x;
    const py = e.y*TILE*SCALE - camera.y;

    // Shadow under enemy
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + TILE*SCALE/2, py + TILE*SCALE - 2, 6*SCALE, 2*SCALE, 0, 0, Math.PI*2);
    ctx.fill();

    // Aggro indicator glow
    if (e.aggro) {
      ctx.fillStyle = 'rgba(255,40,40,0.08)';
      ctx.beginPath();
      ctx.arc(px+TILE*SCALE/2, py+TILE*SCALE/2, TILE*SCALE*0.8, 0, Math.PI*2);
      ctx.fill();
    }

    if (e.hitTimer > 0) {
      drawSprite16(e.type, e.animFrame, e.x, e.y, flipX, '#ff0000');
    }
    drawSprite16(e.type, e.animFrame, e.x, e.y, flipX);

    // HP bar - only show when damaged or aggro
    if (e.hp < e.maxHp || e.aggro) {
      const barW = TILE*SCALE;
      const barY2 = py - 6;
      ctx.fillStyle = '#0a0505'; ctx.fillRect(px, barY2, barW, 4);
      ctx.fillStyle = '#cc3333'; ctx.fillRect(px, barY2, barW*(e.hp/e.maxHp), 4);
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(px, barY2, barW*(e.hp/e.maxHp), 1);
    }
  }
}

function drawBosses() {
  for (const b of bosses) {
    const px = b.x*TILE*SCALE - camera.x;
    const py = b.y*TILE*SCALE - camera.y;
    const sz = TILE*SCALE*b.size;
    const centerX = px + TILE*SCALE/2;
    const centerY = py + TILE*SCALE/2;

    // Boss aura glow
    ctx.save();
    const auraR = sz * 1.2;
    const auraGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, auraR);
    const auraColor = b.phase === 1 ? '255,30,0' : b.isFinal ? '200,40,20' : '180,140,60';
    auraGrad.addColorStop(0, `rgba(${auraColor},0.15)`);
    auraGrad.addColorStop(0.5, `rgba(${auraColor},0.05)`);
    auraGrad.addColorStop(1, `rgba(${auraColor},0)`);
    ctx.fillStyle = auraGrad;
    ctx.fillRect(centerX - auraR, centerY - auraR, auraR * 2, auraR * 2);
    ctx.restore();

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(centerX, py + sz * 0.45, sz * 0.4, sz * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Boss sprite (scaled up from monster animation)
    const frame = b.animFrame;
    const spriteKey = b.sprite + '_' + (frame + 1);
    const spriteImg = images[spriteKey];
    const drawSz = sz;

    if (b.hitTimer > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(centerX - drawSz/2, centerY - drawSz/2, drawSz, drawSz);
    }

    if (spriteImg) {
      ctx.save();
      if (b.facing === 2) {
        ctx.translate(centerX + drawSz/2, centerY - drawSz/2);
        ctx.scale(-1, 1);
        ctx.drawImage(spriteImg, 0, 0, 16, 16, 0, 0, drawSz, drawSz);
      } else {
        ctx.drawImage(spriteImg, 0, 0, 16, 16, centerX - drawSz/2, centerY - drawSz/2, drawSz, drawSz);
      }
      ctx.restore();
    } else {
      // Fallback colored rect
      ctx.fillStyle = b.hitTimer > 0 ? '#ffffff' : b.color;
      ctx.fillRect(centerX - drawSz/2, centerY - drawSz/2, drawSz, drawSz);
    }

    // Phase 2 red outline
    if (b.phase === 1) {
      ctx.strokeStyle = `rgba(255,50,20,${0.5 + Math.sin(Date.now()/150)*0.3})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(centerX - drawSz/2 - 2, centerY - drawSz/2 - 2, drawSz + 4, drawSz + 4);
    }

    // Dragon wings for final boss
    if (b.isFinal) {
      const wingFlap = Math.sin(Date.now()/300)*10;
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = b.color;
      // Left wing
      ctx.beginPath();
      ctx.moveTo(centerX - drawSz/2, centerY - drawSz*0.1);
      ctx.lineTo(centerX - drawSz*1.3, centerY - drawSz*0.6 + wingFlap);
      ctx.lineTo(centerX - drawSz*0.8, centerY - drawSz*0.2 + wingFlap*0.5);
      ctx.lineTo(centerX - drawSz/2, centerY + drawSz*0.3);
      ctx.fill();
      ctx.strokeStyle = '#ff5533'; ctx.lineWidth = 1.5; ctx.stroke();
      // Right wing
      ctx.beginPath();
      ctx.moveTo(centerX + drawSz/2, centerY - drawSz*0.1);
      ctx.lineTo(centerX + drawSz*1.3, centerY - drawSz*0.6 + wingFlap);
      ctx.lineTo(centerX + drawSz*0.8, centerY - drawSz*0.2 + wingFlap*0.5);
      ctx.lineTo(centerX + drawSz/2, centerY + drawSz*0.3);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Horns
      ctx.fillStyle = '#ddaa44';
      ctx.beginPath();
      ctx.moveTo(centerX - drawSz*0.2, centerY - drawSz/2);
      ctx.lineTo(centerX - drawSz*0.3, centerY - drawSz*0.8);
      ctx.lineTo(centerX - drawSz*0.1, centerY - drawSz/2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(centerX + drawSz*0.2, centerY - drawSz/2);
      ctx.lineTo(centerX + drawSz*0.3, centerY - drawSz*0.8);
      ctx.lineTo(centerX + drawSz*0.1, centerY - drawSz/2);
      ctx.fill();
      ctx.restore();
    }

    // ---- Boss HP bar (at top of screen for better visibility) ----
    const barW = 300;
    const barX = CW / 2 - barW / 2;
    const barY = CH - 40;
    ctx.fillStyle = 'rgba(10,5,5,0.8)';
    ctx.fillRect(barX - 4, barY - 20, barW + 8, 36);
    ctx.strokeStyle = 'rgba(180,80,40,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(barX - 4, barY - 20, barW + 8, 36);
    // Name above bar
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ccaa77';
    ctx.fillText(b.name, CW / 2, barY - 6);
    // Bar
    ctx.fillStyle = '#1a0808'; ctx.fillRect(barX, barY, barW, 12);
    const hpGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
    hpGrad.addColorStop(0, b.phase===1 ? '#dd4400' : '#cc2222');
    hpGrad.addColorStop(1, b.phase===1 ? '#ff8800' : '#ff4444');
    ctx.fillStyle = hpGrad;
    ctx.fillRect(barX, barY, barW * (b.hp / b.maxHp), 12);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(barX, barY, barW * (b.hp / b.maxHp), 4);
  }
}

function drawNPCs() {
  for (const n of npcs) {
    n.animTimer += dt;
    if (n.animTimer > 0.3) { n.animTimer = 0; n.animFrame = (n.animFrame+1)%4; }
    const npx = n.x*TILE*SCALE - camera.x;
    const npy = n.y*TILE*SCALE - camera.y;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(npx + TILE*SCALE/2, npy + TILE*SCALE - 2, 6*SCALE, 2*SCALE, 0, 0, Math.PI*2);
    ctx.fill();

    // Use priest2 for upgrader, priest for merchant
    const spriteType = n.type === 'upgrader' ? 'priest2' : 'priest';
    drawSprite16(spriteType, n.animFrame, n.x, n.y, false);

    // Name plate
    const cx = npx + TILE*SCALE/2;
    const nameY = npy - 10;
    const nameW = ctx.measureText(n.name).width + 12;
    ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(10,8,5,0.7)';
    ctx.fillRect(cx - nameW/2, nameY - 10, nameW, 14);
    ctx.fillStyle = '#88dd88';
    ctx.fillText(n.name, cx, nameY);

    // Interaction prompt
    if (Math.hypot(n.x-player.x, n.y-player.y) < 2.5) {
      ctx.fillStyle = 'rgba(10,8,5,0.8)';
      ctx.fillRect(cx - 50, nameY - 30, 100, 18);
      ctx.strokeStyle = 'rgba(200,170,80,0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx - 50, nameY - 30, 100, 18);
      ctx.fillStyle = '#ddcc88'; ctx.font = 'bold 11px monospace';
      ctx.fillText('[F] Interact', cx, nameY - 16);
    }
  }
}

function drawChests() {
  for (const c of chests) {
    const px = c.x*TILE*SCALE - camera.x;
    const py = c.y*TILE*SCALE - camera.y;
    const cx = px + TILE*SCALE/2;
    const cy = py + TILE*SCALE/2;

    // Big beacon for weapon chest during tutorial step 3
    const isWeaponChest = !c.opened && c.item === 'weapon_choice';
    const showBeacon = isWeaponChest && !player.tutorialDone && player.tutorialStep === 3;
    if (showBeacon) {
      ctx.save();
      const pulse = 0.5 + Math.sin(Date.now() / 300) * 0.5;
      // Large pulsing glow circle
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80 + pulse * 20);
      grad.addColorStop(0, 'rgba(255,200,60,0.25)');
      grad.addColorStop(0.5, 'rgba(255,170,40,0.08)');
      grad.addColorStop(1, 'rgba(255,150,30,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - 100, cy - 100, 200, 200);
      // Rotating rays
      ctx.globalAlpha = 0.15 + pulse * 0.1;
      ctx.strokeStyle = '#ffcc44';
      ctx.lineWidth = 2;
      const t = Date.now() / 1500;
      for (let r = 0; r < 4; r++) {
        const a = t + r * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20);
        ctx.lineTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Use individual chest animation sprites
    const frame = Math.floor(Date.now() / 250) % 4;
    const imgKey = c.opened ? ('chestOpen_' + (frame + 1)) : ('chest_' + (frame + 1));
    const img = images[imgKey];
    if (img) {
      // Glow for unopened
      if (!c.opened) {
        ctx.save();
        ctx.shadowColor = showBeacon ? '#ffee66' : '#ffcc44';
        ctx.shadowBlur = showBeacon ? 25 : 10;
        ctx.drawImage(img, 0, 0, 16, 16, px, py, TILE*SCALE, TILE*SCALE);
        ctx.restore();
      } else {
        ctx.drawImage(img, 0, 0, 16, 16, px, py, TILE*SCALE, TILE*SCALE);
      }
    } else {
      // Fallback to doors_lever_chest_animation.png
      const sheetImg = images['doorsChest'];
      if (sheetImg) {
        const srcY = c.opened ? 160 : 144;
        ctx.drawImage(sheetImg, 0, srcY, 16, 16, px, py, TILE*SCALE, TILE*SCALE);
      } else {
        ctx.save();
        if (!c.opened) { ctx.shadowColor = showBeacon ? '#ffee66' : '#ffcc44'; ctx.shadowBlur = showBeacon ? 25 : 8; }
        ctx.fillStyle = c.opened ? '#6b5533' : '#aa8844';
        ctx.fillRect(px+2*SCALE, py+4*SCALE, 12*SCALE, 10*SCALE);
        ctx.strokeStyle = '#ccaa66'; ctx.lineWidth = 1;
