        ctx.strokeRect(px+2*SCALE, py+4*SCALE, 12*SCALE, 10*SCALE);
        if (!c.opened) { ctx.fillStyle='#ffdd44'; ctx.fillRect(px+6*SCALE, py+8*SCALE, 4*SCALE, 3*SCALE); }
        ctx.restore();
      }
    }

    // Label above weapon chest during tutorial
    if (showBeacon) {
      ctx.save();
      const bob = Math.sin(Date.now() / 350) * 4;
      ctx.textAlign = 'center'; ctx.font = 'bold 13px monospace';
      // Background
      ctx.fillStyle = 'rgba(10,8,5,0.85)';
      ctx.fillRect(cx - 65, py - 52 + bob, 130, 22);
      ctx.strokeStyle = '#ffcc44'; ctx.lineWidth = 1;
      ctx.strokeRect(cx - 65, py - 52 + bob, 130, 22);
      // Text
      ctx.fillStyle = '#ffdd66';
      ctx.fillText('YOUR WEAPON IS HERE!', cx, py - 36 + bob);
      // Down arrow
      ctx.fillStyle = '#ffcc44';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('\u2193', cx, py - 8 + Math.sin(Date.now()/200)*3);
      ctx.restore();
    }

    if (!c.opened && Math.hypot(c.x-player.x, c.y-player.y) < 2) {
      ctx.fillStyle='rgba(10,8,5,0.75)';
      ctx.fillRect(cx - 42, py-24, 84, 20);
      ctx.strokeStyle = 'rgba(200,170,80,0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx - 42, py-24, 84, 20);
      ctx.font='bold 11px monospace'; ctx.textAlign='center';
      ctx.fillStyle='#ddcc88';
      ctx.fillText('[F] Open', cx, py-10);
    }
  }
}

function drawItems() {
  for (const item of items) {
    const px = item.x*TILE*SCALE - camera.x;
    const py = item.y*TILE*SCALE - camera.y;
    const bob = Math.sin(Date.now()/300 + item.x*7)*3;

    // Item glow
    ctx.save();
    const glowColor = item.type==='matter' ? '#ffffff' : item.type==='ashes' ? '#ffaa33' : '#ccaa44';
    ctx.shadowColor = glowColor; ctx.shadowBlur = 12;

    if (item.type === 'ashes') {
      const frame = Math.floor(Date.now()/200)%4;
      const cimg = images['coin_'+(frame+1)];
      if (cimg) { ctx.drawImage(cimg, 0,0,16,16, px, py+bob, TILE*SCALE, TILE*SCALE); }
      else { ctx.fillStyle='#ffcc44'; ctx.fillRect(px+3*SCALE, py+3*SCALE+bob, 10*SCALE, 10*SCALE); }
    } else if (item.type === 'matter') {
      // Glowing matter orb
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(px + TILE*SCALE/2, py + TILE*SCALE/2 + bob, 6*SCALE, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#88bbff';
      ctx.beginPath();
      ctx.arc(px + TILE*SCALE/2, py + TILE*SCALE/2 + bob, 4*SCALE, 0, Math.PI*2);
      ctx.fill();
      // Orbiting sparkles
      for (let j = 0; j < 4; j++) {
        const ang = Date.now() / 500 + j * Math.PI / 2;
        const ox = Math.cos(ang) * 8 * SCALE;
        const oy = Math.sin(ang) * 5 * SCALE;
        ctx.fillStyle = 'rgba(200,220,255,0.6)';
        ctx.fillRect(px + TILE*SCALE/2 + ox - 1, py + TILE*SCALE/2 + bob + oy - 1, 3, 3);
      }
    } else if (item.type === 'ore') {
      // Ore with rock sprite from objects
      const objImg = images['objects'];
      if (objImg) {
        const oreCol = item.value <= 5 ? 6 : item.value <= 15 ? 7 : 8;
        ctx.drawImage(objImg, oreCol * 16, 16, 16, 16, px, py + bob, TILE*SCALE, TILE*SCALE);
      } else {
        ctx.fillStyle = '#ffcc55';
        ctx.fillRect(px+3*SCALE, py+3*SCALE+bob, 10*SCALE, 10*SCALE);
      }
    } else {
      const flaskFrame = Math.floor(Date.now()/250) % 4;
      const fImg = images['flask_'+(flaskFrame+1)];
      if (fImg) { ctx.drawImage(fImg, 0,0,16,16, px, py+bob, TILE*SCALE, TILE*SCALE); }
      else { ctx.fillStyle='#55ccee'; ctx.fillRect(px+3*SCALE, py+3*SCALE+bob, 10*SCALE, 10*SCALE); }
    }
    ctx.restore();
  }
}

// drawBonfireInteract agora esta dentro de drawBonfires()
function drawBonfireInteract() {}

// ==================== DARK ATMOSPHERE / LIGHTING ====================
const AREA_VIGNETTE = {
  tutorial:       {r:0,   g:0,   b:0},
  ashWastes:      {r:40,  g:20,  b:0},
  boneCaverns:    {r:0,   g:0,   b:30},
  cursedGrounds:  {r:10,  g:20,  b:5},
  fireDepths:     {r:40,  g:0,   b:0},
  shadowRuins:    {r:20,  g:0,   b:30},
  dragonLair:     {r:50,  g:0,   b:0},
};

function drawLighting() {
  const plx = player.x*TILE*SCALE - camera.x + TILE*SCALE/2;
  const ply = player.y*TILE*SCALE - camera.y + TILE*SCALE/2;
  const r = CW * 0.8;
  const vc = AREA_VIGNETTE[player.currentMap] || {r:0,g:0,b:0};
  const grad = ctx.createRadialGradient(plx, ply, r*0.5, plx, ply, r);
  grad.addColorStop(0, 'rgba('+vc.r+','+vc.g+','+vc.b+',0)');
  grad.addColorStop(0.7, 'rgba('+vc.r+','+vc.g+','+vc.b+',0.1)');
  grad.addColorStop(1, 'rgba('+vc.r+','+vc.g+','+vc.b+',0.3)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, CH);
}

const AMBIENT_COLORS = {
  tutorial:       ['rgba(180,180,180,','rgba(150,150,160,'],
  ashWastes:      ['rgba(160,140,120,','rgba(130,120,100,'],
  boneCaverns:    ['rgba(220,220,230,','rgba(200,200,210,'],
  cursedGrounds:  ['rgba(80,180,60,',  'rgba(60,150,80,'],
  fireDepths:     ['rgba(255,160,40,', 'rgba(255,120,20,'],
  shadowRuins:    ['rgba(160,80,200,', 'rgba(130,60,180,'],
  dragonLair:     ['rgba(255,80,30,',  'rgba(255,50,10,'],
};
const AMBIENT_COUNT = 15;
let ambientParticles = null;

function initAmbientParticles() {
  ambientParticles = [];
  for (let i = 0; i < AMBIENT_COUNT; i++) {
    ambientParticles.push({
      x: Math.random() * CW, y: Math.random() * CH,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.4,
      size: 1 + Math.random() * 2,
      alpha: 0.2 + Math.random() * 0.3,
    });
  }
}

function drawAmbientParticles() {
  if (!ambientParticles) initAmbientParticles();
  const cols = AMBIENT_COLORS[player.currentMap] || AMBIENT_COLORS.tutorial;
  const t = Date.now() / 1000;
  for (let i = 0; i < AMBIENT_COUNT; i++) {
    const p = ambientParticles[i];
    p.x += Math.sin(t * p.speed + p.phase) * 0.3;
    p.y -= p.speed * 0.5;
    // Wrap around screen
    if (p.y < -5) { p.y = CH + 5; p.x = Math.random() * CW; }
    if (p.x < -5) p.x = CW + 5;
    if (p.x > CW + 5) p.x = -5;
    const flicker = 0.7 + Math.sin(t * 2 + p.phase) * 0.3;
    const a = p.alpha * flicker;
    ctx.fillStyle = cols[i % cols.length] + a.toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

    ctx.strokeRect(mmX-2, mmY-2, mmW+4, mmH+4);

    for (let ty=0; ty<map.height; ty++) {
      for (let tx=0; tx<map.width; tx++) {

        let c;
        if (t===3||t===4||t===20) c='#555';

        else if (WALKABLE.has(t)) c='#333';
        else c='#444';
        ctx.fillStyle = c;
        ctx.fillRect(mmX+tx*mmScale, mmY+ty*mmScale, Math.max(1,mmScale), Math.max(1,mmScale));

    ctx.fillStyle = '#4af';
    ctx.fillRect(mmX+player.x*mmScale-1, mmY+player.y*mmScale-1, 3, 3);

    ctx.fillStyle = '#f44';

    ctx.fillText('Mining ' + Math.ceil(prog * 100) + '%', CW / 2, CH - 36);
  }

  // ---- MAP NAME (bottom right) ----
  const map = maps[player.currentMap];
  ctx.font = '11px monospace'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(10,8,15,0.6)';

  ctx.fillText(map.name, CW - 10, CH - 11);

  // ---- OBJECTIVE (top right) ----
  if (player.tutorialDone) {
    const obj = getCurrentObjective();
    ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(10,8,15,0.7)';

function drawIntro() {
  ctx.fillStyle = '#080508'; ctx.fillRect(0, 0, CW, CH);

  // Subtle ember particles
  for (let i = 0; i < 20; i++) {
    const seed = i * 97.3;
    const px = (seed * 5 + Date.now() / 50) % CW;
    const py = CH - ((Date.now() / 30 + seed * 2) % CH);
    ctx.fillStyle = `rgba(200,80,20,${0.05 + Math.sin(i) * 0.03})`;
    ctx.fillRect(px, py, 1.5, 1.5);
  }

  ctx.textAlign = 'center';

  const texts = [
    { text: 'In the beginning, there was nothing but silence.', color: '#887766' },
    { text: 'Then the God shaped this world from the void.', color: '#998877' },
    { text: 'Mountains rose. Rivers flowed. Life blossomed.', color: '#99aa88' },
    { text: 'To protect it all, he forged the Neutral Matter.', color: '#aabbcc' },
    { text: 'A divine substance - the soul of creation itself.', color: '#99aacc' },
    { text: 'But the God grew tired of his creation...', color: '#887766' },
    { text: 'And one day, without warning, he departed.', color: '#776655' },
    { text: 'Everything turned to ashes.', color: '#cc6633' },
    { text: 'The Neutral Matter shattered into nine fragments.', color: '#aabbcc' },
    { text: 'Its guardian - the Dragon - lost its purpose and its mind.', color: '#cc4433' },
    { text: 'Now you must gather the fragments. Forge the divine weapon.', color: '#ccaa66' },
    { text: 'And bring an end to the endless burning...', color: '#ddccaa' },
  ];

  stateTimer += dt;
  const currentText = Math.min(Math.floor(stateTimer / 2.0), texts.length - 1);

  // Letterbox bars
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, 60);
  ctx.fillRect(0, CH - 60, CW, 60);

  for (let i = 0; i <= currentText; i++) {
    const fadeIn = i === currentText ? Math.min(1, (stateTimer - i * 2.0) / 0.8) : 1;
    const fadeOut = i < currentText - 2 ? Math.max(0.2, 1 - (currentText - i) * 0.2) : 1;
    ctx.globalAlpha = Math.max(0, fadeIn * fadeOut);
    ctx.fillStyle = texts[i].color;
    ctx.font = i === 7 ? 'bold 20px monospace' : '16px monospace';
    ctx.fillText(texts[i].text, CW / 2, 110 + i * 38);
  }
  ctx.globalAlpha = 1;

  // Progress dots
  ctx.fillStyle = '#333';
  for (let i = 0; i < texts.length; i++) {
    ctx.fillStyle = i <= currentText ? '#886644' : '#333';
    ctx.beginPath();
    ctx.arc(CW / 2 - (texts.length * 6) + i * 12, CH - 90, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Skip hint - always visible
  ctx.fillStyle = '#554433';
  ctx.font = '11px monospace';
  ctx.fillText('Press ENTER, SPACE or ESC to skip', CW / 2, CH - 30);

  // Allow skip at any time
  if (keys['enter'] || keys['escape'] || keys[' '] || mouse.clicked) {
    keys['enter'] = false; keys['escape'] = false; keys[' '] = false; mouse.clicked = false;
    gameState = STATE.TUTORIAL;
    player.tutorialStep = 0;
    loadMap('tutorial');
    player.hasPickaxe = true;
  }
}

  ctx.fillStyle = '#ddbb66'; ctx.font = 'bold 12px monospace';
  const blink = Math.sin(Date.now() / 300) > 0;
  if (blink) ctx.fillText('[ ' + step.hint + ' ]', CW / 2, boxY + 70);

  // Arrow pointing to objective
  if (step.arrow) {
    drawArrowTo(step.arrow.x, step.arrow.y, step.final ? '#44ff44' : '#ddaa44');
  }
}

function drawArrowTo(tx, ty, color) {
  const px = player.x*TILE*SCALE - camera.x + TILE*SCALE/2;
  const py = player.y*TILE*SCALE - camera.y + TILE*SCALE/2;
  const ax = tx*TILE*SCALE - camera.x + TILE*SCALE/2;
  const ay = ty*TILE*SCALE - camera.y + TILE*SCALE/2;
  const angle = Math.atan2(ay-py, ax-px);
  const dist = Math.min(60, Math.hypot(ax-px, ay-py)*0.3);
  const tipX = px + Math.cos(angle)*dist;
  const tipY = py + Math.sin(angle)*dist;

  // Arrow line from player toward target
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(px+Math.cos(angle)*25, py+Math.sin(angle)*25);
  ctx.lineTo(tipX, tipY); ctx.stroke();
  // Arrow head
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX-Math.cos(angle-0.4)*12, tipY-Math.sin(angle-0.4)*12);
  ctx.lineTo(tipX-Math.cos(angle+0.4)*12, tipY-Math.sin(angle+0.4)*12);
  ctx.fill();

  // Pulsing glow ring at target tile
  const pulse = 0.5 + Math.sin(Date.now() / 300) * 0.5;
  const r = TILE * SCALE * 0.7 + pulse * 6;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.4 + pulse * 0.4;
  ctx.beginPath();
  ctx.arc(ax, ay, r, 0, Math.PI * 2);
  ctx.stroke();
  // Inner glow
  ctx.globalAlpha = 0.1 + pulse * 0.15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(ax, ay, r * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Bouncing chevrons pointing down above target (if target on screen)
  if (ax > 0 && ax < CW && ay > 0 && ay < CH) {
    const bounce = Math.sin(Date.now() / 250) * 5;
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('v', ax, ay - TILE*SCALE - 8 + bounce);
    ctx.globalAlpha = 1;
  }
}

let lastTutorialStep = -1;
let tutorialStepDelay = 0;
function updateTutorial() {
  const step = TUTORIAL_STEPS[player.tutorialStep];
  if (!step) {
    player.tutorialDone = true;
    gameState = STATE.GAMEPLAY;
    return;
  }

  // Chamar onEnter quando entrar num passo novo
  if (player.tutorialStep !== lastTutorialStep) {
    lastTutorialStep = player.tutorialStep;
    tutorialStepDelay = 2.0;
    if (step.onEnter) step.onEnter();
  }

  // Esperar delay antes de checar a condicao
  if (tutorialStepDelay > 0) {
    tutorialStepDelay -= dt;
    return;
  }

  if (step.check()) {
    player.tutorialStep++;
    if (player.tutorialStep >= TUTORIAL_STEPS.length) {
      player.tutorialDone = true;
      gameState = STATE.GAMEPLAY;
    }
  }
}

function drawDialog() {
  // Darken background
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CW, CH);

  // Dialog box - parchment style
  const boxX = 40, boxY = CH - 150, boxW = CW - 80, boxH = 130;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(boxX + 4, boxY + 4, boxW, boxH);

  // Parchment background
  const parchGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
  parchGrad.addColorStop(0, '#2a2218');
  parchGrad.addColorStop(0.5, '#1e1812');
  parchGrad.addColorStop(1, '#2a2218');
  ctx.fillStyle = parchGrad;
  ctx.fillRect(boxX, boxY, boxW, boxH);

  // Border - double line
  ctx.strokeStyle = '#5a4a30'; ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 1;
  ctx.strokeRect(boxX + 4, boxY + 4, boxW - 8, boxH - 8);

  // Corner ornaments
  const corners = [[boxX, boxY], [boxX + boxW, boxY], [boxX, boxY + boxH], [boxX + boxW, boxY + boxH]];
  ctx.fillStyle = '#6a5530';
  for (const [cx, cy] of corners) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }

  // Text
  ctx.fillStyle = '#ddccaa'; ctx.font = '15px monospace'; ctx.textAlign = 'center';
  const words = dialogText.split(' ');
  let lines = ['']; let lineIdx = 0;
  for (const w of words) {
    if ((lines[lineIdx] + ' ' + w).length > 55) { lineIdx++; lines[lineIdx] = ''; }
    lines[lineIdx] = (lines[lineIdx] + ' ' + w).trim();
  }
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], CW / 2, boxY + 40 + i * 24);
  }

  // Continue prompt
  const blink = Math.sin(Date.now() / 400) > 0;
  if (blink) {
    ctx.fillStyle = '#887755'; ctx.font = '11px monospace';
    ctx.fillText('[ ENTER ]', CW / 2, boxY + boxH - 16);
  }
  // Small triangle indicator
  ctx.fillStyle = '#887755';
  const triY = boxY + boxH - 12 + Math.sin(Date.now() / 300) * 3;
  ctx.beginPath();
  ctx.moveTo(CW / 2 + 50, triY);
  ctx.lineTo(CW / 2 + 45, triY - 4);
  ctx.lineTo(CW / 2 + 55, triY - 4);
  ctx.fill();

  if (keys['enter']) { keys['enter'] = false; gameState = STATE.GAMEPLAY; if (dialogCallback) dialogCallback(); }
}

  }

    const canTravel = Object.keys(maps).filter(k => maps[k].bonfires && maps[k].bonfires.length > 0 && (visitedMaps.has(k) || k === 'tutorial'));
    if (canTravel.length > 1) {
      const currentIdx = canTravel.indexOf(player.currentMap);

      gameState = (!player.tutorialDone && player.currentMap === 'tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY;
    }
  }
}

  const px = CW / 2 - pw / 2, py = CW > 0 ? CH / 2 - ph / 2 - 20 : 100;

  ctx.fillStyle = 'rgba(15,12,8,0.95)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#6a5530'; ctx.lineWidth = 2;
  ctx.strokeRect(px, py, pw, ph);
  ctx.strokeStyle = '#3a2a15'; ctx.lineWidth = 1;
  ctx.strokeRect(px + 4, py + 4, pw - 8, ph - 8);

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#dda855'; ctx.font = 'bold 22px monospace';
  ctx.fillText('PAUSED', CW / 2, py + 40);
  ctx.fillStyle = '#4a3a20'; ctx.fillRect(CW / 2 - 60, py + 48, 120, 1);

  // Menu options
  const options = ['Continue', 'Save Game', 'Controls', 'Back to Title'];
  const optDescs = ['Return to game', 'Save your progress', 'View key bindings', 'Exit to title screen'];
  const optCount = options.length;
  for (let i = 0; i < optCount; i++) {
    const oy = py + 80 + i * 55;
    const sel = i === pauseMenu;
    if (sel) {
      ctx.fillStyle = 'rgba(200,170,80,0.1)';
      ctx.fillRect(px + 15, oy - 8, pw - 30, 42);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.strokeRect(px + 15, oy - 8, pw - 30, 42);
    }
    ctx.fillStyle = sel ? '#ffddaa' : '#887766';
    ctx.font = sel ? 'bold 16px monospace' : '15px monospace';
    ctx.fillText(options[i], CW / 2, oy + 12);
    ctx.fillStyle = sel ? '#998866' : '#554433';
    ctx.font = '10px monospace';
    ctx.fillText(optDescs[i], CW / 2, oy + 28);
  }

  // Controls panel (shows when Controls selected)
  if (pauseMenu === 2) {
    const cy = py + ph + 10;
    ctx.fillStyle = 'rgba(15,12,8,0.95)';
    ctx.fillRect(px, cy, pw, 190);
    ctx.strokeStyle = '#4a3a20'; ctx.lineWidth = 1;
    ctx.strokeRect(px, cy, pw, 190);
    ctx.textAlign = 'left'; ctx.font = '12px monospace';
    const controls = [
      ['WASD', 'Move'],
      ['MOUSE / SPACE', 'Attack'],
      ['SHIFT', 'Dodge (invincible)'],
      ['F', 'Interact (NPC, chest, bonfire)'],
      ['E', 'Mine (near ore)'],
      ['Q', 'Use healing flask'],
      ['ESC', 'Pause / Unpause'],
    ];
    for (let i = 0; i < controls.length; i++) {
      const ky = cy + 20 + i * 24;
      ctx.fillStyle = '#ddaa55'; ctx.fillText(controls[i][0], px + 20, ky);
      ctx.fillStyle = '#bbaa88'; ctx.fillText(controls[i][1], px + 175, ky);
    }
  }

  // Bottom hint
  ctx.textAlign = 'center'; ctx.font = '11px monospace';
  ctx.fillStyle = '#665544';
  ctx.fillText('UP/DOWN Select  |  ENTER Confirm  |  ESC Close', CW / 2, py + ph - 15);

  // Input
  if (keys['arrowup']) { keys['arrowup'] = false; pauseMenu = (pauseMenu - 1 + optCount) % optCount; }
  if (keys['arrowdown']) { keys['arrowdown'] = false; pauseMenu = (pauseMenu + 1) % optCount; }
  if (keys['w']) { keys['w'] = false; pauseMenu = (pauseMenu - 1 + optCount) % optCount; }
  if (keys['s']) { keys['s'] = false; pauseMenu = (pauseMenu + 1) % optCount; }
  if (keys['escape']) {
    keys['escape'] = false;
    gameState = pausePrevState;
  }
  if (keys['enter'] || mouse.clicked) {
    keys['enter'] = false; mouse.clicked = false;
    if (pauseMenu === 0) {
      gameState = pausePrevState;
    } else if (pauseMenu === 1) {
      saveMenuMode = 'save';
      saveMenuSlot = 0;
      saveMenuState = 'browse';
      saveInputBuffer = [];
      gameState = STATE.SAVE_MENU;
    } else if (pauseMenu === 3) {
      gameState = STATE.TITLE;
    }
    // pauseMenu === 2 (Controls) just stays on pause showing controls
  }
}

// ==================== TEACHER CONFIG & SAVE SYSTEM ====================
function saveTeacherSettings() {
  try {
    localStorage.setItem('topdouw_teacher', JSON.stringify({ mathYear, gameDifficulty, teacherPin }));
  } catch(e) {}
}
function loadTeacherSettings() {
  try {
    const d = JSON.parse(localStorage.getItem('topdouw_teacher'));
    if (d) {
      mathYear = d.mathYear || 7;
      gameDifficulty = d.gameDifficulty || 'normal';
      teacherPin = d.teacherPin || '';
    }
  } catch(e) {}
}

function getSaveSlots() {
  try {
    const d = JSON.parse(localStorage.getItem('topdouw_saves'));
    if (Array.isArray(d) && d.length === 10) return d;
  } catch(e) {}
  return [null,null,null,null,null,null,null,null,null,null];
}

function saveGame(slotIndex, name) {
  const slots = getSaveSlots();
  const areaNames = { tutorial:'Tutorial', ashWastes:'Ash Wastes', boneCaverns:'Bone Caverns', cursedGrounds:'Cursed Grounds', fireDepths:'Fire Depths', shadowRuins:'Shadow Ruins', dragonLair:'Dragon Lair' };
  slots[slotIndex] = {
    name: name || (slots[slotIndex] && slots[slotIndex].name) || 'Save ' + (slotIndex + 1),
    timestamp: Date.now(),
    areaName: areaNames[player.currentMap] || player.currentMap,
    level: player.level,
    player: {
      x: player.x, y: player.y, hp: player.hp, maxHp: player.maxHp,
      stamina: player.stamina, maxStamina: player.maxStamina,
      ashes: player.ashes, level: player.level,
      stats: { ...player.stats },
      weapon: player.weapon, hasPickaxe: player.hasPickaxe,
      inventory: [...player.inventory],
      matterPieces: [...player.matterPieces], matterCount: player.matterCount,
      weaponLevel: player.weaponLevel,
      currentMap: player.currentMap,
      lastBonfire: { ...player.lastBonfire },
      killedBosses: [...player.killedBosses],
      openedChests: [...player.openedChests],
      tutorialStep: player.tutorialStep, tutorialDone: player.tutorialDone,
      secretFound: player.secretFound,
      deaths: player.deaths,
    },
    visitedMaps: [...visitedMaps],
    gameDifficulty, mathYear, teacherPin,
  };
  try { localStorage.setItem('topdouw_saves', JSON.stringify(slots)); } catch(e) {}
}

function loadGame(slotIndex) {
  const slots = getSaveSlots();
  const s = slots[slotIndex];
  if (!s) return false;
  const p = s.player;
  player.x = p.x; player.y = p.y;
  player.hp = p.hp; player.maxHp = p.maxHp;
  player.stamina = p.stamina; player.maxStamina = p.maxStamina;
  player.ashes = p.ashes; player.level = p.level;
  player.stats = { ...p.stats };
  player.weapon = p.weapon; player.hasPickaxe = p.hasPickaxe;
  player.inventory = [...(p.inventory || [])];
  player.matterPieces = [...(p.matterPieces || [false,false,false,false,false,false,false,false,false])];
  player.matterCount = p.matterCount || 0;
  player.weaponLevel = p.weaponLevel || 0;
  player.currentMap = p.currentMap;
  player.lastBonfire = { ...(p.lastBonfire || { map:'tutorial', x:15, y:17 }) };
  player.killedBosses = new Set(p.killedBosses || []);
  player.openedChests = new Set(p.openedChests || []);
  player.tutorialStep = p.tutorialStep || 0;
  player.tutorialDone = p.tutorialDone || false;
  player.secretFound = p.secretFound || false;
  player.deaths = p.deaths || 0;
  player.dead = false;
  player.attacking = false; player.attackTimer = 0; player.attackCooldown = 0;
  player.mining = false; player.mineTimer = 0;
  player.invincible = 0;
  player.dodging = false; player.dodgeTimer = 0; player.dodgeCooldown = 0;
  player.exitCooldown = 0.5;
  visitedMaps.clear();
  for (const m of (s.visitedMaps || [])) visitedMaps.add(m);
  gameDifficulty = s.gameDifficulty || 'normal';
  mathYear = s.mathYear || 7;
  teacherPin = s.teacherPin || '';
  activeSlot = slotIndex;
  loadMap(player.currentMap, player.x, player.y);
  gameState = player.tutorialDone ? STATE.GAMEPLAY : STATE.TUTORIAL;
  return true;
}

function drawTeacherConfig() {
  ctx.fillStyle = '#0a0808'; ctx.fillRect(0, 0, CW, CH);

  // Embers
  for (let i = 0; i < 30; i++) {
    const seed = i * 137.5;
    const px = (seed * 7.3 + Date.now() / (30 + i % 10)) % CW;
    const py = CH - ((Date.now() / (20 + i % 15) + seed * 3) % (CH + 40));
    const sz = 1 + (i % 3);
    const alpha = (py / CH) * 0.1;
    ctx.fillStyle = `rgba(255,80,20,${Math.max(0, alpha)})`;
    ctx.fillRect(px, py, sz, sz);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#dda855'; ctx.font = 'bold 24px monospace';
  ctx.fillText('TEACHER CONFIGURATION', CW / 2, 50);
  ctx.fillStyle = '#887766'; ctx.font = '12px monospace';
  ctx.fillText('Give to your teacher to choose', CW / 2, 72);
  ctx.fillStyle = '#4a3a20'; ctx.fillRect(CW / 2 - 150, 80, 300, 1);

  const rows = ['Math Year', 'Difficulty', 'PIN Code', 'Confirm'];
  const diffNames = ['easy', 'normal', 'hard', 'hell'];
  const diffLabels = ['Easy', 'Normal', 'Hard', 'Hell'];
  const diffDescs = ['0.6x damage, relaxed', '1x damage, standard', '1.5x dmg, 1.3x HP', '2x dmg, 1.8x HP, no flask drops'];

  for (let i = 0; i < rows.length; i++) {
    const ry = 120 + i * 80;
    const sel = i === teacherConfigMenu;

    if (sel) {
      ctx.fillStyle = 'rgba(200,170,80,0.08)';
      ctx.fillRect(CW / 2 - 250, ry - 10, 500, 65);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.strokeRect(CW / 2 - 250, ry - 10, 500, 65);
    }

    ctx.fillStyle = sel ? '#ffddaa' : '#887766';
    ctx.font = sel ? 'bold 16px monospace' : '14px monospace';
    ctx.fillText(rows[i], CW / 2, ry + 10);

    if (i === 0) {
      // Math Year
      ctx.fillStyle = sel ? '#ffffff' : '#aaaaaa'; ctx.font = 'bold 20px monospace';
      ctx.fillText((sel ? '< ' : '') + 'Year ' + mathYear + (sel ? ' >' : ''), CW / 2, ry + 38);
      ctx.fillStyle = '#998877'; ctx.font = '11px monospace';
      const tierDesc = mathYear <= 7 ? MATH_TIER_NAMES[mathYear] || '' : '';
      ctx.fillText('Covers: ' + tierDesc, CW / 2, ry + 53);
    } else if (i === 1) {
      // Difficulty
      const di = diffNames.indexOf(gameDifficulty);
      ctx.fillStyle = sel ? '#ffffff' : '#aaaaaa'; ctx.font = 'bold 20px monospace';
      ctx.fillText((sel ? '< ' : '') + diffLabels[di] + (sel ? ' >' : ''), CW / 2, ry + 38);
      ctx.fillStyle = '#998877'; ctx.font = '11px monospace';
      ctx.fillText(diffDescs[di], CW / 2, ry + 53);
    } else if (i === 2) {
      // PIN
      ctx.fillStyle = sel ? '#ffffff' : '#aaaaaa'; ctx.font = 'bold 20px monospace';
      const pinDisplay = teacherPinBuffer.length > 0 ? teacherPinBuffer.replace(/./g, '*') : '----';
      ctx.fillText('[ ' + pinDisplay.padEnd(4, '-').split('').join(' ') + ' ]', CW / 2, ry + 38);
      ctx.fillStyle = '#998877'; ctx.font = '11px monospace';
      ctx.fillText(sel ? 'Type 4 digits (Backspace to clear)' : '4-digit lock (optional)', CW / 2, ry + 53);
    } else if (i === 3) {
      // Confirm
      ctx.fillStyle = sel ? '#44dd66' : '#556655'; ctx.font = 'bold 18px monospace';
      ctx.fillText('[ ENTER to Confirm ]', CW / 2, ry + 38);
    }
  }

  // Bottom hint
  ctx.fillStyle = '#665544'; ctx.font = '11px monospace';
  ctx.fillText('W/S or UP/DOWN Select  |  A/D or LEFT/RIGHT Adjust  |  ENTER Confirm  |  ESC Cancel', CW / 2, CH - 20);

  // Process input
  for (const key of teacherInputBuffer) {
    if (key === 'Escape') {
      if (teacherConfigMode === 'edit') {
        gameState = STATE.PAUSE;
      } else {
        gameState = STATE.TITLE;
      }
      keys['escape'] = false;
    } else if (key === 'ArrowUp' || key === 'w') {
      teacherConfigMenu = Math.max(0, teacherConfigMenu - 1);
    } else if (key === 'ArrowDown' || key === 's') {
      teacherConfigMenu = Math.min(3, teacherConfigMenu + 1);
    } else if (key === 'ArrowLeft' || key === 'a') {
      if (teacherConfigMenu === 0) mathYear = Math.max(1, mathYear - 1);
      else if (teacherConfigMenu === 1) {
        const di = diffNames.indexOf(gameDifficulty);
        gameDifficulty = diffNames[Math.max(0, di - 1)];
      }
    } else if (key === 'ArrowRight' || key === 'd') {
      if (teacherConfigMenu === 0) mathYear = Math.min(7, mathYear + 1);
      else if (teacherConfigMenu === 1) {
        const di = diffNames.indexOf(gameDifficulty);
        gameDifficulty = diffNames[Math.min(3, di + 1)];
      }
    } else if (key === 'Enter') {
      // Confirm from any row
      teacherPin = teacherPinBuffer;
      saveTeacherSettings();
      if (teacherConfigMode === 'edit') {
        gameState = STATE.PAUSE;
      } else {
        gameState = STATE.INTRO; introStep = 0; stateTimer = 0;
      }
    } else if (teacherConfigMenu === 2) {
      // PIN input (only when on PIN row)
      if (key === 'Backspace') {
        teacherPinBuffer = teacherPinBuffer.slice(0, -1);
      } else if (key >= '0' && key <= '9' && teacherPinBuffer.length < 4) {
        teacherPinBuffer += key;
      }
    }
  }
  teacherInputBuffer = [];
}

function drawSaveMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, CW, CH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#dda855'; ctx.font = 'bold 22px monospace';
  ctx.fillText(saveMenuMode === 'save' ? 'SAVE GAME' : 'LOAD GAME', CW / 2, 40);
  ctx.fillStyle = '#4a3a20'; ctx.fillRect(CW / 2 - 100, 48, 200, 1);

  const slots = getSaveSlots();
  const slotH = 48, startY = 65, panelW = 500;
  const panelX = CW / 2 - panelW / 2;

  for (let i = 0; i < 10; i++) {
    const sy = startY + i * (slotH + 4);
    const sel = i === saveMenuSlot;
    const s = slots[i];

    ctx.fillStyle = sel ? 'rgba(200,170,80,0.12)' : 'rgba(20,15,10,0.6)';
    ctx.fillRect(panelX, sy, panelW, slotH);
    if (sel) {
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.strokeRect(panelX, sy, panelW, slotH);
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = sel ? '#ffddaa' : '#887766'; ctx.font = 'bold 13px monospace';
    ctx.fillText('Slot ' + (i + 1), panelX + 10, sy + 20);

    if (s) {
      ctx.fillStyle = sel ? '#ffffff' : '#bbbbbb'; ctx.font = '13px monospace';
      ctx.fillText(s.name, panelX + 80, sy + 20);
      ctx.fillStyle = sel ? '#aaaaaa' : '#777777'; ctx.font = '11px monospace';
      ctx.fillText('Lv.' + (s.level || 1) + '  ' + (s.areaName || '?'), panelX + 80, sy + 38);
      ctx.textAlign = 'right';
      const d = new Date(s.timestamp);
      const ts = d.getDate() + '/' + (d.getMonth()+1) + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
      ctx.fillStyle = sel ? '#998877' : '#665544'; ctx.font = '10px monospace';
      ctx.fillText(ts, panelX + panelW - 10, sy + 20);
    } else {
      ctx.fillStyle = sel ? '#888888' : '#555555'; ctx.font = '12px monospace';
      ctx.fillText('--- Empty ---', panelX + 80, sy + 28);
    }
    ctx.textAlign = 'center';
  }

  // Naming overlay
  if (saveMenuState === 'naming') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dda855'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Enter Save Name', CW / 2, CH / 2 - 40);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px monospace';
    const cursor = Math.sin(Date.now() / 300) > 0 ? '_' : '';
    ctx.fillText(saveMenuNameBuffer + cursor, CW / 2, CH / 2 + 10);
    ctx.fillStyle = '#665544'; ctx.font = '12px monospace';
    ctx.fillText('ENTER to confirm  |  ESC to cancel', CW / 2, CH / 2 + 50);
  }

  // Confirm load overlay
  if (saveMenuState === 'confirm_load') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dda855'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Load this save?', CW / 2, CH / 2 - 20);
    ctx.fillStyle = '#887766'; ctx.font = '13px monospace';
    const sl = slots[saveMenuSlot];
    ctx.fillText((sl ? sl.name : '') + ' - Lv.' + (sl ? sl.level : '?'), CW / 2, CH / 2 + 10);
    ctx.fillStyle = '#665544'; ctx.font = '12px monospace';
    ctx.fillText('ENTER to load  |  ESC to cancel', CW / 2, CH / 2 + 40);
  }

  // Confirm delete overlay
  if (saveMenuState === 'confirm_delete') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dd4444'; ctx.font = 'bold 18px monospace';
    ctx.fillText('Delete this save?', CW / 2, CH / 2 - 20);
    ctx.fillStyle = '#887766'; ctx.font = '13px monospace';
    const sd = slots[saveMenuSlot];
    ctx.fillText((sd ? sd.name : '') + ' - Lv.' + (sd ? sd.level : '?'), CW / 2, CH / 2 + 10);
    ctx.fillStyle = '#665544'; ctx.font = '12px monospace';
    ctx.fillText('ENTER to delete  |  ESC to cancel', CW / 2, CH / 2 + 40);
  }

  // Bottom hint
  if (saveMenuState === 'browse') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#665544'; ctx.font = '11px monospace';
    const hint = saveMenuMode === 'save'
      ? 'UP/DOWN Select  |  ENTER Save  |  D Delete  |  ESC Back'
      : 'UP/DOWN Select  |  ENTER Load  |  D Delete  |  ESC Back';
    ctx.fillText(hint, CW / 2, CH - 12);
  }

  // Process input
  for (const key of saveInputBuffer) {
    if (saveMenuState === 'naming') {
      if (key === 'Escape') {
        saveMenuState = 'browse';
      } else if (key === 'Enter') {
        if (saveMenuNameBuffer.length === 0) saveMenuNameBuffer = 'Save ' + (saveMenuSlot + 1);
        saveGame(saveMenuSlot, saveMenuNameBuffer);
        activeSlot = saveMenuSlot;
        saveMenuState = 'browse';
        saveMenuNameBuffer = '';
      } else if (key === 'Backspace') {
        saveMenuNameBuffer = saveMenuNameBuffer.slice(0, -1);
      } else if (key.length === 1 && saveMenuNameBuffer.length < 16) {
        saveMenuNameBuffer += key;
      }
      continue;
    }

    if (saveMenuState === 'confirm_load') {
      if (key === 'Escape') { saveMenuState = 'browse'; }
      else if (key === 'Enter') { loadGame(saveMenuSlot); }
      continue;
    }

    if (saveMenuState === 'confirm_delete') {
      if (key === 'Escape') { saveMenuState = 'browse'; }
      else if (key === 'Enter') {
        const sl2 = getSaveSlots();
        sl2[saveMenuSlot] = null;
        try { localStorage.setItem('topdouw_saves', JSON.stringify(sl2)); } catch(e) {}
        saveMenuState = 'browse';
      }
      continue;
    }

    // Browse state
    if (key === 'Escape') {
      keys['escape'] = false;
      if (saveMenuMode === 'load') { gameState = STATE.TITLE; }
      else { gameState = STATE.PAUSE; }
    } else if (key === 'ArrowUp') {
      saveMenuSlot = (saveMenuSlot - 1 + 10) % 10;
    } else if (key === 'ArrowDown') {
      saveMenuSlot = (saveMenuSlot + 1) % 10;
    } else if (key === 'Enter') {
      if (saveMenuMode === 'save') {
        saveMenuNameBuffer = slots[saveMenuSlot] ? slots[saveMenuSlot].name : '';
        saveMenuState = 'naming';
      } else {
        if (slots[saveMenuSlot]) { saveMenuState = 'confirm_load'; }
      }
    } else if ((key === 'd' || key === 'D') && slots[saveMenuSlot]) {
      saveMenuState = 'confirm_delete';
    }
  }
  saveInputBuffer = [];
}

// ==================== BOSS DEATH CINEMATIC ====================
function drawBossDeath() {
  bossDeathTimer -= dt;
  const t = 4.0 - bossDeathTimer; // elapsed (0 to 4)
  if (!bossDeathData) { gameState = STATE.GAMEPLAY; return; }
  const bd = bossDeathData;
  const bossScreenX = bd.x * TILE * SCALE - camera.x;
  const bossScreenY = bd.y * TILE * SCALE - camera.y;

  // ===== Phase 1 (0-1s): Boss flashes white, screen desaturates, big shake =====
  if (t < 1.0) {
    const p1 = t / 1.0;
    // White flash (bright at start, fading)
    if (t < 0.15) {
      ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - t / 0.15)})`;
      ctx.fillRect(0, 0, CW, CH);
    }
    // Desaturation overlay
    ctx.fillStyle = `rgba(10,5,15,${p1 * 0.4})`;
    ctx.fillRect(0, 0, CW, CH);
    // Boss silhouette flashing
    const flashAlpha = 0.3 + Math.sin(t * 20) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(bossScreenX - 16, bossScreenY - 16, 32, 32);
    // Expanding glow at boss position
    const glowR = 30 + p1 * 80;
    const glow = ctx.createRadialGradient(bossScreenX, bossScreenY, 0, bossScreenX, bossScreenY, glowR);
    glow.addColorStop(0, `rgba(255,200,100,${0.4 * p1})`);
    glow.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(bossScreenX - glowR, bossScreenY - glowR, glowR * 2, glowR * 2);
  }

  // ===== Phase 2 (1-2.5s): Disintegration — particle waves, pillar of light =====
  if (t >= 1.0 && t < 2.5) {
    const p2 = (t - 1.0) / 1.5;
    // Dark overlay
    ctx.fillStyle = `rgba(10,5,15,${0.4 + p2 * 0.2})`;
    ctx.fillRect(0, 0, CW, CH);

    // Pillar of light at boss position
    const pillarW = 40 + 60 * p2;
    const pillarAlpha = 0.5 * (1 - p2 * 0.5);
    const pillarGrad = ctx.createLinearGradient(bossScreenX, bossScreenY - 300, bossScreenX, bossScreenY + 100);
    pillarGrad.addColorStop(0, `rgba(255,255,255,0)`);
    pillarGrad.addColorStop(0.3, `rgba(255,220,150,${pillarAlpha})`);
    pillarGrad.addColorStop(0.7, `rgba(255,180,100,${pillarAlpha * 0.8})`);
    pillarGrad.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = pillarGrad;
    ctx.fillRect(bossScreenX - pillarW / 2, bossScreenY - 300, pillarW, 400);

    // Expanding light ring
    const ringR = p2 * 250;
    const ringAlpha = Math.max(0, 0.6 - p2 * 0.7);
    ctx.strokeStyle = `rgba(255,200,100,${ringAlpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bossScreenX, bossScreenY, ringR, 0, Math.PI * 2); ctx.stroke();

    // Second delayed ring
    if (p2 > 0.3) {
      const ring2R = (p2 - 0.3) * 250;
      const ring2Alpha = Math.max(0, 0.4 - (p2 - 0.3) * 0.6);
      ctx.strokeStyle = `rgba(255,180,80,${ring2Alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bossScreenX, bossScreenY, ring2R, 0, Math.PI * 2); ctx.stroke();
    }

    // Particle wave bursts
    if (Math.random() < 0.4) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 4;
      addParticle(bd.x * TILE + 8, bd.y * TILE + 8, bd.color, 1.5,
        Math.cos(angle) * speed, Math.sin(angle) * speed, 2 + Math.random() * 2);
    }

    // Boss silhouette fading
    const silAlpha = Math.max(0, 1 - p2 * 1.5);
    if (silAlpha > 0) {
      ctx.fillStyle = `rgba(40,20,40,${silAlpha})`;
      ctx.fillRect(bossScreenX - 14, bossScreenY - 14, 28, 28);
    }

    // Vignette (dark edges)
    const vig = ctx.createRadialGradient(bossScreenX, bossScreenY, 50, bossScreenX, bossScreenY, CW * 0.6);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, `rgba(0,0,0,${0.3 * p2})`);
    ctx.fillStyle = vig; ctx.fillRect(0, 0, CW, CH);
  }

  // ===== Phase 3 (2.5-4s): Screen returns, ash reward text, matter glows =====
  if (t >= 2.5) {
    const p3 = (t - 2.5) / 1.5;
    // Screen clearing back
    ctx.fillStyle = `rgba(10,5,15,${0.6 * (1 - p3 * 0.8)})`;
    ctx.fillRect(0, 0, CW, CH);

    // Ash reward text slams in
    if (p3 > 0.1) {
      const textP = Math.min(1, (p3 - 0.1) / 0.3);
      const slamScale = 1 + (1 - textP) * 1.2;
      const textShake = p3 < 0.5 ? (Math.random() - 0.5) * 5 * (1 - textP) : 0;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.translate(CW / 2 + textShake, CH / 2 - 30);
      ctx.scale(slamScale, slamScale);
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 25;
      ctx.fillStyle = '#ffd644'; ctx.font = 'bold 28px monospace';
      ctx.fillText('+' + bd.ashReward + ' Ashes', 0, 0);
      ctx.restore();
    }

    // Boss name fading out below
    if (p3 > 0.3) {
      const nameAlpha = Math.min(1, (p3 - 0.3) / 0.4) * (p3 < 0.9 ? 1 : Math.max(0, (1 - p3) / 0.1));
      ctx.globalAlpha = nameAlpha;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#aa7755'; ctx.font = '16px monospace';
      ctx.fillText(bd.name + ' defeated', CW / 2, CH / 2 + 10);
      ctx.globalAlpha = 1;
    }

    // Matter item glow on ground
    if (bd.matterIndex >= 0 && p3 > 0.4) {
      const glowP = Math.min(1, (p3 - 0.4) / 0.3);
      const mGlowR = 20 + 30 * glowP + Math.sin(t * 5) * 5;
      const mGlow = ctx.createRadialGradient(bossScreenX, bossScreenY, 0, bossScreenX, bossScreenY, mGlowR);
      mGlow.addColorStop(0, `rgba(200,220,255,${0.5 * glowP})`);
      mGlow.addColorStop(1, 'rgba(150,180,255,0)');
      ctx.fillStyle = mGlow;
      ctx.fillRect(bossScreenX - mGlowR, bossScreenY - mGlowR, mGlowR * 2, mGlowR * 2);
    }
  }

  // End of cinematic
  if (bossDeathTimer <= 0) {
    player.ashes += bd.ashReward;
    addFloatText(bd.x, bd.y, '+' + bd.ashReward + ' Ashes', '#ffff00');
    // Drop matter
    if (bd.matterIndex >= 0) {
      items.push({ x: bd.x, y: bd.y, type: 'matter', matterIndex: bd.matterIndex, name: 'Neutral Matter', animTimer: 0 });
    }
    // Boss death dialogue
    if (bd.bossDeathLines[bd.mapName]) {
      setTimeout(() => showDialog(bd.bossDeathLines[bd.mapName]), 500);
    }
    if (bd.isFinal) {
      setTimeout(() => { gameState = STATE.WIN; }, 3000);
    }
    bossDeathData = null;
    gameState = (!player.tutorialDone && player.currentMap === 'tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY;
  }
}

function drawBossIntro() {
  stateTimer -= dt;
  const progress = Math.min(1, (3 - stateTimer) / 3);

  // Screen shake at intro start
  if (stateTimer > 2.5) addShake(5 * (1 - progress), 0.05);

  // Red vignette
  ctx.fillStyle = `rgba(40,0,0,${progress * 0.6})`;
  ctx.fillRect(0, 0, CW, CH);

  // Heartbeat pulse effect
  const heartbeat = Math.sin(stateTimer * 6) * 0.5 + 0.5;
  ctx.fillStyle = `rgba(80,0,0,${heartbeat * 0.15 * progress})`;
  ctx.fillRect(0, 0, CW, CH);

  // Letterbox bars sliding in
  const barH = 65 * progress;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, barH);
  ctx.fillRect(0, CH - barH, CW, barH);

  // Red energy lines from edges toward center
  if (progress > 0.2) {
    const lineP = Math.min(1, (progress - 0.2) / 0.5);
    ctx.strokeStyle = `rgba(200,40,20,${0.3 * lineP})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 8; i++) {
      const edgeX = (i < 4) ? (i % 2 === 0 ? 0 : CW) : CW / 2;
      const edgeY = (i >= 4) ? (i % 2 === 0 ? 0 : CH) : CH / 2;
      const targetX = CW / 2 + (Math.random() - 0.5) * 30;
      const targetY = CH / 2 + (Math.random() - 0.5) * 20;
      ctx.beginPath();
      ctx.moveTo(edgeX, edgeY);
      // Lightning segments
      let lx = edgeX, ly = edgeY;
      for (let s = 1; s <= 4; s++) {
        const f = s / 4 * lineP;
        const nx = edgeX + (targetX - edgeX) * f + (Math.random() - 0.5) * 40;
        const ny = edgeY + (targetY - edgeY) * f + (Math.random() - 0.5) * 30;
        ctx.lineTo(nx, ny);
      }
      ctx.stroke();
    }
  }

  if (bosses.length > 0) {
    ctx.textAlign = 'center';

    // Boss name with slam effect — starts big, settles to normal
    ctx.save();
    const nameP = Math.min(1, progress / 0.6);
    const slamScale = 1 + (1 - nameP) * 1.5;
    const nameShake = nameP < 1 ? (Math.random() - 0.5) * 4 * (1 - nameP) : 0;
    ctx.translate(CW / 2 + nameShake, CH / 2 - 10);
    ctx.scale(slamScale, slamScale);
    ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 30 * progress + heartbeat * 10;
    ctx.fillStyle = `rgba(255,60,20,${progress})`;
    ctx.font = 'bold 34px monospace';
    ctx.fillText(bosses[0].name, 0, 0);
    ctx.restore();

    // Subtitle - boss-specific dialogue
    const bossIntroLines = {
      ashWastes: ['"These ashes are MINE to guard!"', '"The city fell, but I will not."'],
      boneCaverns: ['"Join the bones of those who failed..."', '"I promised I would never leave this post."'],
      cursedGrounds: ['"The cure... never... came..."', '"Let the poison take you as it took me."'],
      fireDepths: ['"BURN as this world burned!"', '"I cannot stop. I do not know how."'],
      shadowRuins: ['"The knowledge shall not be stolen!"', '"Veyra swore to protect these pages. I am her oath."'],
      dragonLair: ['"You dare enter MY lair?!"', '"He left me here. Alone. For a THOUSAND years."'],
    };
    const introLines = bossIntroLines[player.currentMap] || ['Prepare for combat!'];
    const subtitleAlpha = Math.max(0, progress - 0.4);
    ctx.fillStyle = `rgba(170,100,60,${subtitleAlpha})`;
    ctx.font = '14px monospace';
    for (let li = 0; li < introLines.length; li++) {
      ctx.fillText(introLines[li], CW / 2, CH / 2 + 35 + li * 22);
    }

    // Red decorative lines
    ctx.strokeStyle = `rgba(200,50,20,${progress * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(CW / 2 - 220 * progress, CH / 2 + 14);
    ctx.lineTo(CW / 2 + 220 * progress, CH / 2 + 14);
    ctx.stroke();
  }

  if (stateTimer <= 0) { gameState = (!player.tutorialDone && player.currentMap === 'tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY; }
}

function drawGameOver() {
  // Red-black radial gradient
  const deathBg = ctx.createRadialGradient(CW / 2, CH / 2, 50, CW / 2, CH / 2, CW * 0.6);
  deathBg.addColorStop(0, '#1a0505');
  deathBg.addColorStop(1, '#080000');
  ctx.fillStyle = deathBg; ctx.fillRect(0, 0, CW, CH);

  // Red vignette
  const vig = ctx.createRadialGradient(CW / 2, CH / 2, CW * 0.2, CW / 2, CH / 2, CW * 0.6);
  vig.addColorStop(0, 'rgba(120,0,0,0)');
  vig.addColorStop(1, 'rgba(120,0,0,0.3)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, CW, CH);

  // Blood drip particles
  for (let i = 0; i < 15; i++) {
    const px = (i * 67 + 50) % CW;
    const py = ((Date.now() / 20 + i * 43) % (CH + 20)) - 10;
    ctx.fillStyle = `rgba(150,20,20,${0.1 + (i % 3) * 0.05})`;
    ctx.fillRect(px, py, 2, 4 + i % 3);
  }

  ctx.textAlign = 'center';
  // Death text with glow
  ctx.save();
  ctx.shadowColor = '#cc0000'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#cc2222'; ctx.font = 'bold 40px monospace';
  ctx.fillText('YOU DIED', CW / 2, CH / 2 - 30);
  ctx.restore();

  // Decorative line
  ctx.strokeStyle = '#4a1111'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CW / 2 - 180, CH / 2 - 5);
  ctx.lineTo(CW / 2 + 180, CH / 2 - 5);
  ctx.stroke();

  ctx.fillStyle = '#885544'; ctx.font = '14px monospace';
  ctx.fillText('Lost ' + Math.floor(player.ashes * 0.3) + ' ashes', CW / 2, CH / 2 + 25);

  ctx.fillStyle = '#665555'; ctx.font = '12px monospace';
  ctx.fillText('Deaths: ' + player.deaths, CW / 2, CH / 2 + 48);

  const blink = Math.sin(Date.now() / 500) > 0;
  if (blink) {
    ctx.fillStyle = '#776655'; ctx.font = '13px monospace';
    ctx.fillText('[ ENTER ] Respawn at bonfire', CW / 2, CH / 2 + 80);
  }
  if (keys['enter']) { keys['enter'] = false; respawnPlayer(); }
}

// ==================== MATTER LORE QUOTES ====================
const MATTER_LORE = {
  0: '"The first fragment hums with forgotten prayers..."',
  1: '"A commander\'s oath, crystallized into pure energy..."',
  2: '"The land\'s poison, purified into divine light..."',
  3: '"Fire tamed. The element remembers its purpose..."',
  4: '"Ancient knowledge given form. The pages sing..."',
  5: '"A dragon\'s loneliness, transformed into hope..."',
  6: '"Found in the depths, where light dares not reach..."',
  7: '"Hidden by the God himself, waiting for the worthy..."',
  8: '"The final piece. The weapon stirs with anticipation..."',
};

// ==================== CUTSCENE: MATERIA NEUTRA ====================
function drawMatterCutscene() {
  matterCutsceneTimer -= dt;
  const t = 8.0 - matterCutsceneTimer; // elapsed time (0 to 8)
  const centerX = CW / 2, centerY = CH / 2;

  // ===== PHASE 1 (0-1.5s): Slow-motion freeze — desaturate, dramatic zoom, rumble =====
  if (t < 1.5) {
    const p1 = t / 1.5;
    // Darken/desaturate screen
    ctx.fillStyle = `rgba(0,0,10,${p1 * 0.85})`;
    ctx.fillRect(0, 0, CW, CH);
    // Deep rumble shake
    if (t > 0.3) addShake(3 * p1, 0.05);
    // Letterbox bars sliding in
    const barH = 50 * p1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, barH);
    ctx.fillRect(0, CH - barH, CW, barH);
    // Zoom vignette
    const vig = ctx.createRadialGradient(centerX, centerY, CW * 0.15 * (1 - p1 * 0.3), centerX, centerY, CW * 0.55);
    vig.addColorStop(0, 'rgba(0,0,20,0)');
    vig.addColorStop(1, `rgba(0,0,20,${p1 * 0.6})`);
    ctx.fillStyle = vig; ctx.fillRect(0, 0, CW, CH);
  }

  // ===== PHASE 2 (1.5-3.5s): Pillar of light erupts, matter rises =====
  if (t >= 1.5 && t < 3.5) {
    const p2 = (t - 1.5) / 2.0;
    // Black background
    ctx.fillStyle = '#000005'; ctx.fillRect(0, 0, CW, CH);
    // Letterbox
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, 50); ctx.fillRect(0, CH - 50, CW, 50);

    // Pillar of light from below
    const pillarW = 60 + 40 * p2;
    const pillarH = CH * p2;
    const pillarGrad = ctx.createLinearGradient(centerX, CH, centerX, CH - pillarH);
    pillarGrad.addColorStop(0, `rgba(150,180,255,${0.6 * p2})`);
    pillarGrad.addColorStop(0.5, `rgba(200,220,255,${0.3 * p2})`);
    pillarGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = pillarGrad;
    ctx.fillRect(centerX - pillarW / 2, CH - pillarH, pillarW, pillarH);

    // Energy tendrils reaching toward center
    for (let i = 0; i < 12; i++) {
      const angle = t * 0.6 + i * Math.PI / 6;
      const len = (100 + i * 30) * p2;
      const startX = centerX + Math.cos(angle) * len;
      const startY = centerY + Math.sin(angle) * len * 0.7;
      ctx.strokeStyle = `rgba(180,200,255,${0.15 + Math.sin(t * 3 + i) * 0.1})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      // Lightning-like segments
      let lx = startX, ly = startY;
      const segs = 5;
      for (let s = 1; s <= segs; s++) {
        const frac = s / segs;
        const tx = startX + (centerX - startX) * frac + (Math.random() - 0.5) * 20;
        const ty = startY + (centerY - startY) * frac + (Math.random() - 0.5) * 20;
        ctx.lineTo(tx, ty);
      }
      ctx.stroke();
    }

    // Matter sphere rising from bottom
    const sphereY = CH * 0.8 - (CH * 0.8 - centerY) * Math.min(1, p2 * 1.5);
    const sphereSize = 20 + 20 * p2;
    const pulse = 1 + Math.sin(t * 6) * 0.1;
    // Outer glow
    const glow = ctx.createRadialGradient(centerX, sphereY, 0, centerX, sphereY, sphereSize * 3 * pulse);
    glow.addColorStop(0, 'rgba(200,220,255,0.5)');
    glow.addColorStop(0.4, 'rgba(150,180,255,0.2)');
    glow.addColorStop(1, 'rgba(100,130,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(centerX - sphereSize * 3, sphereY - sphereSize * 3, sphereSize * 6, sphereSize * 6);
    // Sphere
    const sGrad = ctx.createRadialGradient(centerX, sphereY, 0, centerX, sphereY, sphereSize * pulse);
    sGrad.addColorStop(0, '#ffffff');
    sGrad.addColorStop(0.4, '#ddeeff');
    sGrad.addColorStop(0.8, '#8899cc');
    sGrad.addColorStop(1, 'rgba(80,100,180,0)');
    ctx.fillStyle = sGrad;
    ctx.beginPath(); ctx.arc(centerX, sphereY, sphereSize * pulse, 0, Math.PI * 2); ctx.fill();

    // Screen flash at end of phase 2
    if (p2 > 0.85) {
      const flashAlpha = (p2 - 0.85) / 0.15 * 0.8;
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, CW, CH);
      addShake(8, 0.1);
    }
  }

  // ===== PHASE 3 (3.5-6s): Absorption — shockwave, achievement banner, fragment count =====
  if (t >= 3.5 && t < 6.0) {
    const p3 = (t - 3.5) / 2.5;
    // Dark background fading back
    ctx.fillStyle = `rgba(0,0,10,${1 - p3 * 0.3})`;
    ctx.fillRect(0, 0, CW, CH);
    // Letterbox
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, 50); ctx.fillRect(0, CH - 50, CW, 50);

    // Shockwave rings expanding outward
    for (let ring = 0; ring < 3; ring++) {
      const ringDelay = ring * 0.3;
      const ringP = Math.max(0, p3 - ringDelay);
      if (ringP > 0) {
        const radius = ringP * 350;
        const alpha = Math.max(0, 0.5 - ringP * 0.6);
        ctx.strokeStyle = `rgba(200,220,255,${alpha})`;
        ctx.lineWidth = 3 - ring;
        ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Imploding particles toward center (early phase)
    if (p3 < 0.5) {
      for (let i = 0; i < 16; i++) {
        const angle = i * Math.PI / 8 + t;
        const dist = (1 - p3 * 2) * 200;
        const px = centerX + Math.cos(angle) * dist;
        const py = centerY + Math.sin(angle) * dist * 0.6;
        ctx.fillStyle = `rgba(255,255,255,${0.5 - p3})`;
        ctx.fillRect(px - 2, py - 2, 4, 4);
      }
    }

    // Achievement banner: "FRAGMENT ACQUIRED"
    if (p3 > 0.15) {
      const textP = Math.min(1, (p3 - 0.15) / 0.3);
      // Slam effect: starts big, settles
      const slamScale = 1 + (1 - textP) * 0.8;
      const textShake = p3 < 0.5 ? (Math.random() - 0.5) * 4 * (1 - textP) : 0;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.translate(centerX + textShake, 120);
      ctx.scale(slamScale, slamScale);
      // Golden text with glow
      ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 20 + 10 * Math.sin(t * 4);
      ctx.fillStyle = '#ffd644';
      ctx.font = 'bold 36px monospace';
      ctx.fillText('FRAGMENT ACQUIRED', 0, 0);
      // White outline
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.strokeText('FRAGMENT ACQUIRED', 0, 0);
      ctx.restore();

      // Fragment count
      const countAlpha = Math.min(1, (p3 - 0.3) / 0.3);
      if (countAlpha > 0) {
        ctx.globalAlpha = countAlpha;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#aabbdd'; ctx.font = 'bold 22px monospace';
        ctx.fillText('Fragment ' + (matterCutsceneIndex + 1) + ' of 9', centerX, 170);
        ctx.globalAlpha = 1;
      }
    }

    // Lore quote
    if (p3 > 0.5) {
      const loreAlpha = Math.min(1, (p3 - 0.5) / 0.5);
      ctx.globalAlpha = loreAlpha;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#99aacc'; ctx.font = 'italic 15px monospace';
      const loreText = MATTER_LORE[matterCutsceneIndex] || '"The fragment pulses with unknown energy..."';
      ctx.fillText(loreText, centerX, centerY + 20);
      ctx.globalAlpha = 1;
    }

    // Progress bar with dramatic fill
    if (p3 > 0.6) {
      const barAlpha = Math.min(1, (p3 - 0.6) / 0.3);
      ctx.globalAlpha = barAlpha;
      const barW = 320, barH = 14;
      const barX = centerX - barW / 2, barY = CH - 100;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(barX, barY, barW, barH);
      for (let i = 0; i < 9; i++) {
        const segX = barX + i * (barW / 9) + 1;
        const segW = barW / 9 - 2;
        if (player.matterPieces[i]) {
          // Lit segment with glow
          ctx.fillStyle = '#aaccff';
          ctx.fillRect(segX, barY + 1, segW, barH - 2);
          ctx.fillStyle = 'rgba(180,210,255,0.3)';
          ctx.fillRect(segX, barY + 1, segW, (barH - 2) / 2);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          ctx.fillRect(segX, barY + 1, segW, barH - 2);
        }
      }
      // Count text below bar
      ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 16px monospace';
      ctx.fillText(player.matterCount + ' / 9', centerX, barY + barH + 22);
      if (player.matterCount >= 9) {
        ctx.fillStyle = '#44ff88'; ctx.font = '13px monospace';
        ctx.fillText('All fragments gathered! Find the Smith!', centerX, barY + barH + 42);
      }
      ctx.globalAlpha = 1;
    }
  }

  // ===== PHASE 4 (6-8s): Afterglow — golden particles rain, vignette, fade out =====
  if (t >= 6.0) {
    const p4 = (t - 6.0) / 2.0;
    // Background with soft fade
    ctx.fillStyle = `rgba(0,0,10,${0.7 + p4 * 0.3})`;
    ctx.fillRect(0, 0, CW, CH);
    // Letterbox slowly retracting
    const barRetract = 50 * (1 - p4);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, barRetract); ctx.fillRect(0, CH - barRetract, CW, barRetract);

    // Golden/white sparkles raining down
    for (let i = 0; i < 30; i++) {
      const sx = (i * 37 + t * 40) % CW;
      const sy = ((t - 6) * 120 + i * 29) % (CH + 20) - 10;
      const sparkAlpha = (1 - p4) * (0.3 + Math.sin(t * 5 + i) * 0.2);
      const colors = ['#ffd644', '#ffffff', '#aaccff'];
      ctx.fillStyle = colors[i % 3];
      ctx.globalAlpha = Math.max(0, sparkAlpha);
      const sSize = 1.5 + Math.sin(t * 3 + i * 0.5) * 1;
      ctx.fillRect(sx, sy, sSize, sSize);
    }
    ctx.globalAlpha = 1;

    // Soft vignette
    const softVig = ctx.createRadialGradient(centerX, centerY, CW * 0.15, centerX, centerY, CW * 0.5);
    softVig.addColorStop(0, 'rgba(0,0,0,0)');
    softVig.addColorStop(1, `rgba(0,0,0,${0.4 * (1 - p4)})`);
    ctx.fillStyle = softVig; ctx.fillRect(0, 0, CW, CH);

    // Lingering lore quote & progress
    if (p4 < 0.7) {
      ctx.globalAlpha = 1 - p4 / 0.7;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#99aacc'; ctx.font = 'italic 15px monospace';
      const loreText = MATTER_LORE[matterCutsceneIndex] || '"The fragment pulses with unknown energy..."';
      ctx.fillText(loreText, centerX, centerY + 20);
      // Progress bar
      const barW = 320, barH = 14;
      const barX = centerX - barW / 2, barY = CH - 100;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(barX, barY, barW, barH);
      for (let i = 0; i < 9; i++) {
        const segX = barX + i * (barW / 9) + 1;
        const segW = barW / 9 - 2;
        ctx.fillStyle = player.matterPieces[i] ? '#aaccff' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(segX, barY + 1, segW, barH - 2);
      }
      ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 16px monospace';
      ctx.fillText(player.matterCount + ' / 9', centerX, barY + barH + 22);
      ctx.globalAlpha = 1;
    }

    // Final fade to black
    if (p4 > 0.7) {
      const fadeOut = (p4 - 0.7) / 0.3;
      ctx.fillStyle = `rgba(0,0,0,${fadeOut})`;
      ctx.fillRect(0, 0, CW, CH);
    }
  }

  // End of cutscene
  if (matterCutsceneTimer <= 0) {
    gameState = (!player.tutorialDone && player.currentMap === 'tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY;
  }
}

function drawCutscene() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
  cutsceneTimer -= 0.016;

  // Hollow Knight style weapon upgrade scene
  ctx.textAlign = 'center';

  // Weapon in center
  const weaponY = CH/2 + Math.sin(Date.now()/500)*10;
  ctx.fillStyle = player.weapon==='sword' ? '#aaccff' : '#bb8844';
  if (player.weapon === 'sword') {
    ctx.fillRect(CW/2-4, weaponY-30, 8, 60);
    ctx.fillRect(CW/2-16, weaponY-4, 32, 8);
  } else {
    ctx.fillRect(CW/2-3, weaponY-25, 6, 50);
    ctx.fillRect(CW/2-12, weaponY-25, 24, 20);
  }

  // Glowing particles
  for (let i = 0; i < 20; i++) {
    const angle = (Date.now()/1000 + i*0.314) ;
    const dist = 50 + Math.sin(Date.now()/500+i)*20;
    const px = CW/2 + Math.cos(angle)*dist;
    const py = weaponY + Math.sin(angle)*dist*0.5;
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(i+Date.now()/200)*0.3})`;
    ctx.fillRect(px-2, py-2, 4, 4);
  }

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px monospace';
  ctx.fillText('The Neutral Matter fuses...', CW/2, 80);
  ctx.fillStyle = '#ffcc44'; ctx.font = '16px monospace';
  const wname = player.weapon==='sword'?'Sword':'Axe';
  ctx.fillText(wname+' +'+player.weaponLevel, CW/2, CH-80);

  if (cutsceneTimer <= 0) { gameState = (!player.tutorialDone && player.currentMap==='tutorial') ? STATE.TUTORIAL : STATE.GAMEPLAY; }
}

function drawWin() {
  // Dark to gold gradient
  const winBg = ctx.createLinearGradient(0, 0, 0, CH);
  winBg.addColorStop(0, '#0a0805');
  winBg.addColorStop(0.5, '#1a1408');
  winBg.addColorStop(1, '#0a0805');
  ctx.fillStyle = winBg; ctx.fillRect(0, 0, CW, CH);

  // Gold particle celebration
  for (let i = 0; i < 60; i++) {
    const seed = i * 73.7;
    const px = (seed * 5 + Date.now() / (25 + i % 8)) % CW;
    const py = CH - ((Date.now() / (18 + i % 12) + seed * 2.5) % (CH + 30));
    const sz = 1 + (i % 3);
    const hue = 35 + (i * 7) % 30;
    ctx.fillStyle = `hsla(${hue},80%,60%,${0.15 + Math.sin(Date.now() / 400 + i) * 0.1})`;
    ctx.fillRect(px, py, sz, sz);
  }

  ctx.textAlign = 'center';

  // Victory title with golden glow
  ctx.save();
  ctx.shadowColor = '#ffaa22'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#ddaa33'; ctx.font = 'bold 44px monospace';
  ctx.fillText('VICTORY!', CW / 2, CH / 2 - 100);
  ctx.restore();
  ctx.fillStyle = '#ffcc55'; ctx.font = 'bold 44px monospace';
  ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 800) * 0.15;
  ctx.fillText('VICTORY!', CW / 2, CH / 2 - 101);
  ctx.globalAlpha = 1;

  // Decorative line
  ctx.strokeStyle = '#5a4a20'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CW / 2 - 200, CH / 2 - 70);
  ctx.lineTo(CW / 2 + 200, CH / 2 - 70);
  ctx.stroke();
  ctx.fillStyle = '#aa8833'; ctx.save();
  ctx.translate(CW / 2, CH / 2 - 70); ctx.rotate(Math.PI / 4);
  ctx.fillRect(-4, -4, 8, 8); ctx.restore();

  ctx.fillStyle = '#eeddcc'; ctx.font = '16px monospace';
  ctx.fillText('Cindara, the Ash Dragon, has been freed.', CW / 2, CH / 2 - 80);

  // Epilogue - scrolling text based on time
  const winTime = Date.now() / 1000;
  const epilogue = [
    'With the divine weapon forged from Neutral Matter,',
    'you did not destroy Cindara. You released her.',
    '',
    'She was never evil. She was the God\'s most faithful creation.',
    'A guardian who waited a thousand years at the gate,',
    'hoping her creator would return. He never did.',
    'Loneliness became fire. Fire became the world\'s wound.',
    '',
    'But now, with the nine fragments reunited,',
    'divine energy flows through the land once more.',
    'The ashes begin to fade. Rain falls for the first time in centuries.',
    'Grass sprouts where there was only destruction.',
    'Children will play here again, someday.',
    '',
    'Far away, beyond the edges of this world,',
    'the God watches. And for the first time in a thousand years...',
    'he smiles.',
    '',
    'You did not just save a world. You gave it a second chance.',
  ];
  ctx.fillStyle = '#998877'; ctx.font = '13px monospace';
  for (let i = 0; i < epilogue.length; i++) {
    const lineAlpha = Math.min(1, Math.max(0, (winTime - 1 - i * 0.4) * 2));
    ctx.fillStyle = epilogue[i] === '' ? 'transparent' : 'rgba(160,140,120,' + lineAlpha + ')';
    ctx.fillText(epilogue[i], CW / 2, CH / 2 - 40 + i * 20);
  }

  // Stats
  ctx.fillStyle = '#776655'; ctx.fillRect(CW / 2 - 150, CH / 2 + 220, 300, 1);
  ctx.fillStyle = '#ccaa66'; ctx.font = '14px monospace';
  ctx.fillText('Final Level: ' + player.level, CW / 2, CH / 2 + 245);
  ctx.fillText('Bosses Defeated: ' + player.killedBosses.size + '/6', CW / 2, CH / 2 + 265);
  ctx.fillText('Matter Collected: ' + player.matterCount + '/9', CW / 2, CH / 2 + 285);

  ctx.fillStyle = '#ddccaa'; ctx.font = 'bold 16px monospace';
  ctx.fillText('Thank you for playing!', CW / 2, CH / 2 + 310);

  const blink = Math.sin(Date.now() / 500) > 0;
  if (blink) {
    ctx.fillStyle = '#665544'; ctx.font = '12px monospace';
    ctx.fillText('[ ENTER ] Restart', CW / 2, CH - 30);
  }
  if (keys['enter']) { keys['enter'] = false; location.reload(); }
}

// ==================== MAIN GAME LOOP ====================
let lastTime = 0;

function gameLoop(time) {
  dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;

  ctx.clearRect(0, 0, CW, CH);

  switch (gameState) {
    case STATE.LOADING:
      ctx.fillStyle = '#080508'; ctx.fillRect(0,0,CW,CH);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#665544'; ctx.font = '13px monospace';
      ctx.fillText('Loading...', CW/2, CH/2 - 10);
      // Loading bar
      const loadProg = assetsLoaded / Math.max(1, assetsTotal);
      ctx.fillStyle = '#1a1512'; ctx.fillRect(CW/2 - 120, CH/2 + 8, 240, 10);
      const loadGrad = ctx.createLinearGradient(CW/2-120, 0, CW/2+120, 0);
      loadGrad.addColorStop(0, '#aa5522'); loadGrad.addColorStop(1, '#dd7733');
      ctx.fillStyle = loadGrad;
      ctx.fillRect(CW/2 - 120, CH/2 + 8, 240 * loadProg, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(CW/2 - 120, CH/2 + 8, 240 * loadProg, 3);
      ctx.fillStyle = '#444'; ctx.font = '10px monospace';
      ctx.fillText(assetsLoaded + ' / ' + assetsTotal, CW/2, CH/2 + 32);
      if (assetsLoaded >= assetsTotal) gameState = STATE.TITLE;
      break;

    case STATE.TITLE:
      drawTitle();
      break;

    case STATE.INTRO:
      drawIntro();
      break;

    case STATE.WEAPON_CHOICE:
      drawWeaponChoice();
      break;

    case STATE.TUTORIAL:
      // ESC -> Pause
      if (keys['escape']) {
        keys['escape'] = false;
        pauseMenu = 0;
        pausePrevState = STATE.TUTORIAL;
        gameState = STATE.PAUSE;
        break;
      }
      updateShake(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateBosses(dt);
      updateParticles(dt);
      updateFloatTexts(dt);
      updateTutorial();
      updateCamera(player, maps[player.currentMap].width, maps[player.currentMap].height);

      drawMap();
      drawExits();
      drawBonfires();
      drawItems();
      drawChests();
      drawNPCs();
      drawEnemies();
      drawBosses();
      drawPlayer();
      drawParticles();
      drawFloatTexts();
      drawLighting();
      drawAmbientParticles();
      drawHUD();
      drawTutorialOverlay();
      break;

    case STATE.GAMEPLAY:
      // ESC -> Pause
      if (keys['escape']) {
        keys['escape'] = false;
        pauseMenu = 0;
        pausePrevState = STATE.GAMEPLAY;
        gameState = STATE.PAUSE;
        break;
      }
      // TAB -> toggle objective arrow
      if (keys['tab']) {
        keys['tab'] = false;
        showObjectiveArrow = !showObjectiveArrow;
        addFloatText(player.x, player.y, showObjectiveArrow ? 'Arrow ON' : 'Arrow OFF', '#aaaaaa');
      }
      // Story intro overlay
      if (storyIntroActive) {
        storyIntroTimer -= dt;
        if (storyIntroTimer <= 0 || keys['f'] || keys['enter'] || mouse.clicked) {
          storyIntroActive = false;
          keys['f'] = false; keys['enter'] = false;
        }
      }
      updateShake(dt);
      if (!storyIntroActive) {
        updatePlayer(dt);
        updateEnemies(dt);
        updateBosses(dt);
      }
      updateParticles(dt);
      updateFloatTexts(dt);
      updateCamera(player, maps[player.currentMap].width, maps[player.currentMap].height);

      drawMap();
      drawExits();
      drawBonfires();
      drawItems();
      drawChests();
      drawNPCs();
      drawEnemies();
      drawBosses();
      drawPlayer();
      drawParticles();
      drawFloatTexts();
      drawLighting();
      drawAmbientParticles();
      drawHUD();
      // Objective arrow
      if (!storyIntroActive) {
        const arrowTarget = getObjectiveArrowTarget();
        if (arrowTarget) drawArrowTo(arrowTarget.x, arrowTarget.y, arrowTarget.color);
      }
      // Path hint text
      if (pathHintTimer > 0) {
        const hAlpha = Math.min(1, pathHintTimer < 1 ? pathHintTimer : 1);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = 'italic 13px monospace';
        ctx.fillStyle = 'rgba(180,160,130,' + hAlpha + ')';
        ctx.fillText(pathHintText, CW / 2, CH - 20);
        ctx.restore();
        pathHintTimer -= dt;
      }
      // Story intro overlay
      if (storyIntroActive) {
        const alpha = Math.min(1, storyIntroTimer > 4 ? (5 - storyIntroTimer) : storyIntroTimer < 1 ? storyIntroTimer : 1);
        ctx.fillStyle = 'rgba(0,0,0,' + (0.75 * alpha) + ')';
        ctx.fillRect(0, 0, CW, CH);
        // Letterbox
        ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
        ctx.fillRect(0, 0, CW, 80); ctx.fillRect(0, CH - 80, CW, 80);
        // Area name
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(200,170,100,' + alpha + ')';
        ctx.font = 'bold 28px monospace';
        ctx.fillText(maps[player.currentMap].name, CW / 2, 180);
        // Decorative line
        ctx.fillStyle = 'rgba(150,120,60,' + (alpha * 0.5) + ')';
        ctx.fillRect(CW / 2 - 100, 190, 200, 1);
        // Story lines
        ctx.font = '13px monospace';
        for (let i = 0; i < storyIntroLines.length; i++) {
          ctx.fillStyle = 'rgba(200,190,170,' + alpha + ')';
          ctx.fillText(storyIntroLines[i], CW / 2, 230 + i * 24);
        }
        // Skip hint
        ctx.fillStyle = 'rgba(130,110,80,' + (alpha * (Math.sin(Date.now() / 400) * 0.3 + 0.7)) + ')';
        ctx.font = '10px monospace';
        ctx.fillText('Press F to continue', CW / 2, CH - 100);
      }
      break;

    case STATE.DIALOG:
      // Keep game visible behind dialog
      updateCamera(player, maps[player.currentMap].width, maps[player.currentMap].height);
      drawMap(); drawExits(); drawBonfires(); drawItems(); drawChests(); drawNPCs(); drawEnemies(); drawBosses(); drawPlayer();
      drawLighting(); drawHUD();
      drawDialog();
      break;

    case STATE.SHOP:
      drawShop();
      break;

    case STATE.BONFIRE:
      drawBonfire();
      break;

    case STATE.BOSS_INTRO:
      updateCamera(player, maps[player.currentMap].width, maps[player.currentMap].height);
      drawMap(); drawBonfires(); drawItems(); drawNPCs(); drawEnemies(); drawBosses(); drawPlayer();
      drawLighting();
      drawBossIntro();
      break;

    case STATE.BOSS_DEATH:
      updateShake(dt);
      updateParticles(dt);
      updateCamera(player, maps[player.currentMap].width, maps[player.currentMap].height);
      drawMap(); drawBonfires(); drawItems(); drawNPCs(); drawEnemies(); drawBosses(); drawPlayer();
      drawParticles();
      drawLighting();
      drawBossDeath();
      break;

    case STATE.GAME_OVER:
      drawGameOver();
      break;

    case STATE.CUTSCENE:
      drawCutscene();
      break;

    case STATE.MATTER_CUTSCENE:
      drawMatterCutscene();
      break;

    case STATE.WIN:
      drawWin();
      break;

    case STATE.PAUSE:
      drawPause();
      break;

    case STATE.MATH:
      updateMath();
      drawMath();
      break;

    case STATE.SAVE_MENU:
      drawSaveMenu();
      break;
  }

  mouse.clicked = false;
  requestAnimationFrame(gameLoop);
}

// ==================== INIT ====================
function init() {
  // Scale canvas to fit window
  function resize() {
    const ratio = CW / CH;
    let w = window.innerWidth, h = window.innerHeight;
    if (w/h > ratio) w = h * ratio; else h = w / ratio;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  loadAllAssets();
  loadTeacherSettings();
  requestAnimationFrame(gameLoop);
}

init();
</script>
